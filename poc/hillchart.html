<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Hillchart – minimal D3</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .hill { stroke:#9ca3af; stroke-width:3; fill:none; }
    .pt { cursor:grab; }
  </style>
</head>
<body class="bg-gray-100 min-h-screen grid place-items-center p-6">

  <svg id="hill" class="bg-white rounded-lg shadow" role="img" aria-label="Hillchart"></svg>

  <script>
    // ----- layout
    const containerW = Math.min(900, Math.floor(window.innerWidth * 0.92));
    const w = containerW, h = Math.round(w/3);
    const svg = d3.select("#hill").attr("width", w).attr("height", h);

    // x-range op de svg
    const xMin = 20, xMax = w-20, xMid = (xMin + xMax)/2;

    // ----- hill functie (sinus, zoals het voorbeeld)
    const amplitude = h/2.5;
    const period    = w;
    const phase     = w/4;
    const vShift    = h/2;
    const B = (2*Math.PI)/period;
    const hillY = (x) => amplitude * Math.sin(B * (x + phase)) + vShift;

    // hill pad
    const hillPts = d3.range(xMin, xMax).map(x => ({x, y: hillY(x)}));
    svg.append("path")
      .datum(hillPts)
      .attr("class", "hill")
      .attr("d", d3.line()
        .curve(d3.curveBasis)
        .x(d => d.x)
        .y(d => d.y)
      );

    // middenlijn (optioneel)
    svg.append("line")
      .attr("x1", xMid).attr("x2", xMid)
      .attr("y1", hillY(xMid) + h/8)
      .attr("y2", amplitude + vShift - h/8)
      .attr("stroke", "#9ca3af")
      .attr("stroke-dasharray", "5,5");

    // labels (zoals voorbeeld)
    const labels = [
      { x: xMid - xMid/2, text: "RESEARCHING" },
      { x: xMid + xMid/2, text: "DEVELOPING" },
    ];
    labels.forEach(({x, text}) => {
      svg.append("text")
        .attr("x", x)
        .attr("y", amplitude + vShift + 16)
        .attr("text-anchor", "middle")
        .attr("font-size", w > 640 ? 14 : 10)
        .attr("fill", "#4b5563")
        .text(text);
    });

    // ----- punten
    const palette = ["#3b82f6","#ef4444","#10b981","#a855f7","#f59e0b"];

    let points = [
      { id:1, label:"A", x: xMin + 60, color: palette[0] },
      { id:2, label:"B", x: xMid - xMid/3, color: palette[1] },
      { id:3, label:"C", x: xMid + xMid/4, color: palette[2] },
    ].map(d => ({...d, y: hillY(d.x)}));

    const r = Math.max(6, w/100); // radius schaalt mee

    const g = svg.selectAll(".pt")
      .data(points, d => d.id)
      .enter()
      .append("g")
      .attr("class","pt")
      .attr("transform", d => `translate(${d.x},${d.y})`)
      .call(
        d3.drag()
          .on("start", dragStarted)
          .on("drag", dragged)
          .on("end", dragEnded)
      );

    g.append("circle")
      .attr("r", r)
      .attr("fill", d => d.color);

    g.append("text")
      .attr("y", -r-6)
      .attr("text-anchor","middle")
      .attr("font-size", 12)
      .attr("fill", "#374151")
      .text(d => d.label);

    function clampX(x){ return Math.max(xMin, Math.min(xMax, x)); }

    function dragStarted(event, d){
      d3.select(this).select("circle").attr("r", r*1.2);
    }
    function dragged(event, d){
      d.x = clampX(event.x);
      d.y = hillY(d.x);
      d3.select(this).attr("transform", `translate(${d.x},${d.y})`);
    }
    function dragEnded(event, d){
      d3.select(this).select("circle").attr("r", r);
    }

    // responsive: redraw bij resize (optioneel, simpelste: reload)
    window.addEventListener('resize', () => location.reload());
  </script>
</body>
</html>
