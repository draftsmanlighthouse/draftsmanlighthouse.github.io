<!DOCTYPE html>
<html>
<head>
    <title>Mermaid Diagram Viewer/Editor</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mermaid/10.6.1/mermaid.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 1200px;
            margin: 20px auto;
            padding: 0 20px;
        }
        .container {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .controls {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        .viewer-container, .editor-container {
            border: 1px solid #ccc;
            min-height: 400px;
            padding: 20px;
            background: white;
            border-radius: 4px;
        }
        .viewer-container {
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .editor-container {
            display: none;
            flex-direction: column;
            gap: 10px;
        }
        .editor-container.active {
            display: flex;
        }
        .viewer-container.hidden {
            display: none;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
            width: fit-content;
        }
        button:hover {
            background-color: #45a049;
        }
        button.secondary {
            background-color: #008CBA;
        }
        button.secondary:hover {
            background-color: #007399;
        }
        select {
            padding: 8px 16px;
            font-size: 16px;
            border-radius: 4px;
            border: 1px solid #ccc;
        }
        textarea {
            width: 100%;
            min-height: 300px;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            resize: vertical;
        }
        .preview {
            border: 1px solid #ddd;
            padding: 20px;
            background: #f9f9f9;
            border-radius: 4px;
            min-height: 200px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .error {
            color: #d32f2f;
            padding: 10px;
            background: #ffebee;
            border-radius: 4px;
            margin-top: 10px;
        }
        .button-group {
            display: flex;
            gap: 10px;
        }
    </style>
</head>
<body>
<h1>Mermaid Diagram Viewer/Editor</h1>
<div class="container">
    <div class="controls" id="view-controls">
        <button onclick="app.startEditing()">Edit Diagram</button>
        <select id="theme-select" onchange="app.changeTheme(this.value)">
            <option value="default">Default Theme</option>
            <option value="dark">Dark Theme</option>
            <option value="forest">Forest Theme</option>
            <option value="neutral">Neutral Theme</option>
        </select>
    </div>

    <div class="viewer-container" id="viewer">
        <div id="diagram-display"></div>
    </div>

    <div class="editor-container" id="editor">
        <h3>Edit Mermaid Code</h3>
        <textarea id="mermaid-code" placeholder="Enter your Mermaid diagram code here..."></textarea>
        <div class="button-group">
            <button onclick="app.saveAndExit()">Save & Exit</button>
            <button class="secondary" onclick="app.preview()">Preview</button>
            <button class="secondary" onclick="app.cancelEdit()">Cancel</button>
        </div>
        <div id="error-message"></div>
        <h3>Preview</h3>
        <div class="preview" id="preview-area"></div>
    </div>
</div>

<script>
const app = {
    isEditing: false,
    currentDiagram: '',
    currentTheme: 'default',

    init() {
        // Load saved diagram or use default
        const saved = this.loadFromStorage();
        this.currentDiagram = saved || `graph TD
    A[Start] --> B{Is it working?}
    B -->|Yes| C[Great!]
    B -->|No| D[Debug]
    D --> B
    C --> E[End]`;

        mermaid.initialize({
            startOnLoad: false,
            theme: this.currentTheme
        });

        this.displayDiagram();
    },

    loadFromStorage() {
        try {
            const data = JSON.parse(atob(location.hash.substring(1)));
            return data.diagram;
        } catch (e) {
            return null;
        }
    },

    saveToStorage() {
        const data = { diagram: this.currentDiagram };
        location.hash = btoa(JSON.stringify(data));
    },

    async displayDiagram() {
        const container = document.getElementById('diagram-display');
        container.innerHTML = '';

        try {
            const { svg } = await mermaid.render('diagram-svg', this.currentDiagram);
            container.innerHTML = svg;
        } catch (error) {
            container.innerHTML = `<div style="color: #d32f2f;">Error rendering diagram: ${error.message}</div>`;
        }
    },

    startEditing() {
        this.isEditing = true;
        document.getElementById('viewer').classList.add('hidden');
        document.getElementById('editor').classList.add('active');
        document.getElementById('view-controls').style.display = 'none';
        document.getElementById('mermaid-code').value = this.currentDiagram;
        this.preview();
    },

    async preview() {
        const code = document.getElementById('mermaid-code').value;
        const previewArea = document.getElementById('preview-area');
        const errorArea = document.getElementById('error-message');

        previewArea.innerHTML = '';
        errorArea.innerHTML = '';

        try {
            const { svg } = await mermaid.render('preview-svg', code);
            previewArea.innerHTML = svg;
        } catch (error) {
            errorArea.innerHTML = `<div class="error">Error: ${error.message}</div>`;
            previewArea.innerHTML = '<div style="color: #666;">Invalid diagram code</div>';
        }
    },

    saveAndExit() {
        const code = document.getElementById('mermaid-code').value.trim();
        if (code) {
            this.currentDiagram = code;
            this.saveToStorage();
        }
        this.exitEditor();
    },

    cancelEdit() {
        this.exitEditor();
    },

    exitEditor() {
        this.isEditing = false;
        document.getElementById('viewer').classList.remove('hidden');
        document.getElementById('editor').classList.remove('active');
        document.getElementById('view-controls').style.display = 'flex';
        document.getElementById('error-message').innerHTML = '';
        this.displayDiagram();
    },

    changeTheme(theme) {
        this.currentTheme = theme;
        mermaid.initialize({
            startOnLoad: false,
            theme: theme
        });
        this.displayDiagram();
    }
};

// Initialize app when page loads
window.addEventListener('load', () => app.init());
</script>
</body>
</html>
