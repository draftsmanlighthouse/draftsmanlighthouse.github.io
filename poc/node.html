<!DOCTYPE html>
<meta charset="utf-8">
<body style="margin:0;background:#f9fafb;">
  <div x-data="NodeDiagram" x-init="render()"></div>

  <script src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
  <script src="https://d3js.org/d3.v7.min.js"></script>

  <script>
  document.addEventListener('alpine:init', () => {
    Alpine.data('NodeDiagram', function(){
      return {
        highlighted: "bf54bfca-3bd8-4b41-9e84-4dd0671bf986",

        // --- voorbeelddata (gebruik jouw JSON hier) ---
        rawData: {
          "2a33d267-d8b3-491b-8cb8-068a64f78f09": {
            outbound: { "bf54bfca-3bd8-4b41-9e84-4dd0671bf986": "parent of" },
            title: "Documenting Tracepaper"
          },
          "bf54bfca-3bd8-4b41-9e84-4dd0671bf986": {
            outbound: {
              "89ebb234-da99-4e5b-ae43-e2739b386925": "parent of",
              "a201f648-b359-4621-b45c-8ea40b4d76e3": "parent of"
            },
            title: "System setup"
          },
          "89ebb234-da99-4e5b-ae43-e2739b386925": { title: "EAP 1: Functional boundaries" },
          "a201f648-b359-4621-b45c-8ea40b4d76e3": { title: "EAP 2: Serverless preference" }
        },

        render() {
          // Convert JSON to D3 format
          const nodes = Object.entries(this.rawData).map(([id, obj]) => ({
            id,
            title: obj.title
          }));

          const links = [];
          for (const [sourceId, obj] of Object.entries(this.rawData)) {
            if (obj.outbound) {
              for (const [targetId, label] of Object.entries(obj.outbound)) {
                links.push({ source: sourceId, target: targetId, label });
              }
            }
          }

          // Setup SVG
          const width = window.innerWidth;
          const height = window.innerHeight;
          const svg = d3.select(this.$el)
            .append("svg")
            .attr("width", "100%")
            .attr("height", "100vh");

          const simulation = d3.forceSimulation(nodes)
            .force("link", d3.forceLink(links).distance(150).id(d => d.id))
            .force("charge", d3.forceManyBody().strength(-250))
            .force("center", d3.forceCenter(width / 2, height / 2));

          const link = svg.append("g")
            .attr("stroke", "#d1d5db")
            .selectAll("line")
            .data(links)
            .join("line")
            .attr("stroke-width", 1.5);

          const node = svg.append("g")
            .attr("stroke", "#fff")
            .attr("stroke-width", 1.5)
            .selectAll("circle")
            .data(nodes)
            .join("circle")
            .attr("r", d => d.id === this.highlighted ? 22 : 15)
            .attr("fill", d => d.id === this.highlighted ? "#f59e0b" : "#4f46e5")
            .call(drag(simulation))
            .on("mouseover", (event, d) => {
              if (d.id !== this.highlighted) d3.select(event.currentTarget).attr("fill", "#818cf8");
              label.filter(l => l.id === d.id)
                .attr("visibility", "visible")
                .attr("fill", "black")
                .attr("font-weight", "bold");
            })
            .on("mouseout", (event, d) => {
              if (d.id !== this.highlighted) d3.select(event.currentTarget).attr("fill", "#4f46e5");
              if (d.id !== this.highlighted)
                label.filter(l => l.id === d.id).attr("visibility", "hidden");
            })
            .on("dblclick", (event, d) => {
              console.log("🟠 Double-clicked:", d);
            });

          const label = svg.append("g")
            .selectAll("text")
            .data(nodes)
            .join("text")
            .attr("text-anchor", "middle")
            .attr("dy", 28)
            .attr("visibility", d => d.id === this.highlighted ? "visible" : "hidden")
            .attr("fill", "black")
            .attr("font-size", "10px")
            .attr("font-weight", d => d.id === this.highlighted ? "bold" : "normal")
            .text(d => d.title);

          simulation.on("tick", () => {
            link
              .attr("x1", d => d.source.x)
              .attr("y1", d => d.source.y)
              .attr("x2", d => d.target.x)
              .attr("y2", d => d.target.y);

            node
              .attr("cx", d => d.x)
              .attr("cy", d => d.y);

            label
              .attr("x", d => d.x)
              .attr("y", d => d.y);
          });

          // Internal drag helper
          function drag(simulation) {
            function dragstarted(event, d) {
              if (!event.active) simulation.alphaTarget(0.3).restart();
              d.fx = d.x;
              d.fy = d.y;
            }
            function dragged(event, d) {
              d.fx = event.x;
              d.fy = event.y;
            }
            function dragended(event, d) {
              if (!event.active) simulation.alphaTarget(0);
              d.fx = null;
              d.fy = null;
            }
            return d3.drag().on("start", dragstarted).on("drag", dragged).on("end", dragended);
          }
        }
      }
    });
  });
  </script>
</body>
