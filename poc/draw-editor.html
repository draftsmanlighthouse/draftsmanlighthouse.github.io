<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Excalidraw Browser Embed</title>

  <link
    rel="stylesheet"
    href="https://esm.sh/@excalidraw/excalidraw@0.18.0/dist/dev/index.css"
  />
  <script>
    window.EXCALIDRAW_ASSET_PATH =
      "https://esm.sh/@excalidraw/excalidraw@0.18.0/dist/prod/";
  </script>

  <!-- ✅ React 18 ESM build -->
  <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@18.2.0",
        "react/jsx-runtime": "https://esm.sh/react@18.2.0/jsx-runtime",
        "react-dom": "https://esm.sh/react-dom@18.2.0"
      }
    }
  </script>
</head>
<body>
  <div id="app" style="width:100vw;height:100vh"></div>

<script type="module">
  import * as ExcalidrawLib from "https://esm.sh/@excalidraw/excalidraw@0.18.0/dist/dev/index.js?external=react,react-dom";
  window.ExcalidrawLib = ExcalidrawLib;

  const React = await import("react");
  const ReactDOM = await import("react-dom");

  function App() {
    const [sceneToLoad, setSceneToLoad] = React.useState(null);
    const [appState, setAppState] = React.useState({});

    // --- Luister op load events van parent
    React.useEffect(() => {
      const handler = (event) => {
        if (event.data.type === "load" && Array.isArray(event.data.elements)) {
          console.log("[Excalidraw] Remounting with new scene");
          setSceneToLoad(event.data.elements);
        }
      };
      window.addEventListener("message", handler);
      return () => window.removeEventListener("message", handler);
    }, []);

    // --- Render Excalidraw met nieuwe key bij iedere load
    return React.createElement(ExcalidrawLib.Excalidraw, {
      key: JSON.stringify(sceneToLoad?.map((e) => e.id) ?? []), // force remount
      initialData: { elements: sceneToLoad ?? [], appState },
      onChange: (els) => {
        window.parent.postMessage({ type: "SCENE_UPDATE", elements: els }, "*");
      },
    });
  }

  const root = ReactDOM.createRoot(document.getElementById("app"));
  root.render(React.createElement(App));
</script>
</body>
</html>
