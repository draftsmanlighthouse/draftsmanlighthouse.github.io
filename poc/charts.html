<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <title>Chart & Table Editor (Alpine + DaisyUI)</title>

  <!-- Tailwind + DaisyUI -->
  <script src="https://cdn.tailwindcss.com?plugins=forms,typography,aspect-ratio,line-clamp"></script>
  <script src="https://cdn.jsdelivr.net/npm/daisyui@4.12.10/dist/full.min.js"></script>

  <!-- Alpine.js -->
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>

  <!-- Chart.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
</head>
<body class="min-h-screen bg-base-200 p-6">
  <main x-data="chartEditor" class="max-w-6xl mx-auto space-y-6">

    <h1 class="text-3xl font-bold">Chart & Table Viewer / Editor</h1>

    <!-- Controls -->
    <div x-show="!isEditing" class="flex flex-wrap items-center gap-3">
      <button @click="startEditing" class="btn btn-primary btn-sm">Edit Data</button>

      <select @change="changeChartType($event.target.value)" class="select select-bordered select-sm">
        <option value="bar" selected>Bar Chart</option>
        <option value="line">Line Chart</option>
        <option value="pie">Pie Chart</option>
        <option value="doughnut">Doughnut Chart</option>
        <option value="radar">Radar Chart</option>
      </select>

      <select @change="changeViewMode($event.target.value)" class="select select-bordered select-sm">
        <option value="chart" selected>Chart View</option>
        <option value="table">Table View</option>
        <option value="both">Both</option>
      </select>
    </div>

    <!-- Viewer -->
    <div x-show="!isEditing" x-cloak class="card bg-base-100 shadow-md p-6 space-y-6">
      <div id="chart-view" x-show="['chart','both'].includes(currentViewMode)" class="flex justify-center">
        <div class="w-full max-w-3xl">
          <canvas x-ref="chartCanvas"></canvas>
        </div>
      </div>

      <div id="table-view" x-show="['table','both'].includes(currentViewMode)" class="overflow-x-auto">
        <div x-ref="tableDisplay"></div>
      </div>
    </div>

    <!-- Editor -->
    <div x-show="isEditing" x-cloak class="card bg-base-100 shadow-md p-6">
      <!-- Tabs -->
      <div role="tablist" class="tabs tabs-boxed mb-4">
        <a role="tab" :class="{'tab-active': currentEditorMode==='json'}" @click="switchTab('json', $event)" class="tab">JSON Editor</a>
        <a role="tab" :class="{'tab-active': currentEditorMode==='csv'}" @click="switchTab('csv', $event)" class="tab">CSV Editor</a>
      </div>

      <!-- JSON Editor -->
      <div x-show="currentEditorMode==='json'">
        <h3 class="text-lg font-semibold mb-2">Edit Data (JSON Format)</h3>
        <textarea x-ref="jsonData" class="textarea textarea-bordered w-full h-80 font-mono text-sm" placeholder='{"labels": [...], "datasets": [...]}'></textarea>
        <div class="alert alert-info mt-3">
          <span>
            <strong>JSON Format:</strong>
            <code>{ "labels": [...], "datasets": [{ "label": "...", "data": [...] }] }</code>
          </span>
        </div>
      </div>

      <!-- CSV Editor -->
      <div x-show="currentEditorMode==='csv'" x-cloak>
        <h3 class="text-lg font-semibold mb-2">Edit Data (CSV Format)</h3>
        <textarea x-ref="csvData" class="textarea textarea-bordered w-full h-80 font-mono text-sm" placeholder="Label,Dataset1,Dataset2"></textarea>
        <div class="alert alert-info mt-3">
          <span>
            <strong>CSV Format:</strong>
            First row = labels, subsequent rows = datasets. First column = dataset name.
          </span>
        </div>
      </div>

      <!-- Buttons -->
      <div class="flex gap-3 mt-6">
        <button @click="saveAndExit" class="btn btn-success btn-sm">Save & Exit</button>
        <button @click="cancelEdit" class="btn btn-outline btn-sm">Cancel</button>
      </div>

      <!-- Error -->
      <div class="mt-4" x-show="error">
        <div class="alert alert-error">
          <span x-text="error"></span>
        </div>
      </div>
    </div>
  </main>

  <!-- Alpine component -->
  <script>
  document.addEventListener('alpine:init', () => {
    Alpine.data('chartEditor', () => ({
      chart: null,
      currentData: null,
      currentChartType: 'bar',
      currentViewMode: 'chart',
      currentEditorMode: 'json',
      isEditing: false,
      error: '',

      init() {
        const saved = this.loadFromStorage();
        this.currentData = saved || {
          labels: ['January', 'February', 'March', 'April', 'May', 'June'],
          datasets: [{
            label: 'Sales 2024',
            data: [65, 59, 80, 81, 56, 55],
            backgroundColor: 'rgba(75, 192, 192, 0.2)',
            borderColor: 'rgba(75, 192, 192, 1)',
            borderWidth: 1
          }]
        };
        this.$nextTick(() => {
          this.displayChart();
          this.displayTable();
        });
      },

      /* ---------- STORAGE ---------- */
      loadFromStorage() {
        try {
          const data = JSON.parse(atob(location.hash.substring(1)));
          if (data.chartType) this.currentChartType = data.chartType;
          return data.chartData;
        } catch {
          return null;
        }
      },
      saveToStorage() {
        const data = { chartData: this.currentData, chartType: this.currentChartType };
        location.hash = btoa(JSON.stringify(data));
      },

      /* ---------- DISPLAY ---------- */
      displayChart() {
        const ctx = this.$refs.chartCanvas;
        if (this.chart) this.chart.destroy();

        const colors = [
          'rgba(75,192,192,0.2)', 'rgba(255,99,132,0.2)',
          'rgba(255,206,86,0.2)', 'rgba(54,162,235,0.2)',
          'rgba(153,102,255,0.2)', 'rgba(255,159,64,0.2)'
        ];
        const borderColors = colors.map(c => c.replace('0.2', '1'));

        const datasets = this.currentData.datasets.map((ds, i) => ({
          ...ds,
          backgroundColor: ds.backgroundColor ||
            (['pie', 'doughnut'].includes(this.currentChartType)
              ? colors
              : colors[i % colors.length]),
          borderColor: ds.borderColor ||
            (['pie', 'doughnut'].includes(this.currentChartType)
              ? borderColors
              : borderColors[i % borderColors.length]),
          borderWidth: ds.borderWidth || 1
        }));

        this.chart = new Chart(ctx, {
          type: this.currentChartType,
          data: { labels: this.currentData.labels, datasets },
          options: {
            responsive: true,
            plugins: { legend: { position: 'top' } },
            scales: ['pie', 'doughnut', 'radar'].includes(this.currentChartType)
              ? {}
              : { y: { beginAtZero: true } }
          }
        });
      },

      displayTable() {
        const container = this.$refs.tableDisplay;
        let html = `<table class='table table-zebra w-full'>
          <thead><tr><th>Label</th>`;
        this.currentData.datasets.forEach(ds => (html += `<th>${ds.label}</th>`));
        html += '</tr></thead><tbody>';
        this.currentData.labels.forEach((label, i) => {
          html += `<tr><td class="font-semibold">${label}</td>`;
          this.currentData.datasets.forEach(ds => {
            html += `<td>${ds.data[i] || 0}</td>`;
          });
          html += '</tr>';
        });
        html += '</tbody></table>';
        container.innerHTML = html;
      },

      /* ---------- INTERACTIONS ---------- */
      changeChartType(type) {
        this.currentChartType = type;
        this.displayChart();
        this.saveToStorage();
      },
      changeViewMode(mode) {
        this.currentViewMode = mode;
      },

      /* ---------- EDITOR ---------- */
      startEditing() {
        this.isEditing = true;
        this.error = '';
        this.$nextTick(() => {
          this.$refs.jsonData.value = JSON.stringify(this.currentData, null, 2);
          this.$refs.csvData.value = this.dataToCSV();
        });
      },
      switchTab(mode, event) {
        this.currentEditorMode = mode;
      },

      dataToCSV() {
        let csv = 'Label,' + this.currentData.datasets.map(ds => ds.label).join(',') + '\n';
        this.currentData.labels.forEach((label, i) => {
          csv +=
            label +
            ',' +
            this.currentData.datasets.map(ds => ds.data[i] || 0).join(',') +
            '\n';
        });
        return csv;
      },
      csvToData(csv) {
        const lines = csv.trim().split('\n');
        const headers = lines[0].split(',');
        const labels = [];
        const datasets = headers.slice(1).map(h => ({ label: h.trim(), data: [] }));
        for (let i = 1; i < lines.length; i++) {
          const values = lines[i].split(',');
          labels.push(values[0].trim());
          for (let j = 1; j < values.length; j++) {
            datasets[j - 1].data.push(parseFloat(values[j]) || 0);
          }
        }
        return { labels, datasets };
      },

      saveAndExit() {
        this.error = '';
        try {
          if (this.currentEditorMode === 'json') {
            this.currentData = JSON.parse(this.$refs.jsonData.value);
          } else {
            this.currentData = this.csvToData(this.$refs.csvData.value);
          }
          this.saveToStorage();
          this.isEditing = false;
          this.$nextTick(() => {
            this.displayChart();
            this.displayTable();
          });
        } catch (e) {
          this.error = `Error: ${e.message}`;
        }
      },
      cancelEdit() {
        this.isEditing = false;
        this.error = '';
      }
    }));
  });
  </script>
</body>
</html>
