<!DOCTYPE html>
<html data-theme="light">
<head>
    <title>Excalidraw Editor</title>
    <script defer src="https://cdnjs.cloudflare.com/ajax/libs/alpinejs/3.13.5/cdn.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/daisyui/4.7.2/full.min.css" rel="stylesheet" type="text/css" />
    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .main-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 0.5rem;
            gap: 0.5rem;
        }
        .editor-container {
            flex: 1;
            min-height: 0;
            position: relative;
        }
        iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 1px solid #ccc;
            border-radius: 0.5rem;
        }
        .modal-backdrop {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .modal-content {
            background: white;
            padding: 1.5rem;
            border-radius: 0.5rem;
            min-width: 300px;
        }
    </style>
</head>
<body x-data="excaliDrawEditor">
<div class="main-container">
    <!-- Header met controls -->
    <div class="flex justify-between items-center">
        <h1 class="text-xl font-bold">Excalidraw Editor</h1>
        <div class="flex gap-2">
            <button @click="showSaveModal = true" class="btn btn-sm btn-primary">Save</button>
            <button @click="showLoadModal = true" class="btn btn-sm">Load</button>
        </div>
    </div>

    <!-- Editor Area -->
    <div class="editor-container">
        <div id="editor-container" class="w-full h-full"></div>
    </div>

    <!-- Status Bar -->
    <div class="flex justify-between text-sm opacity-70">
        <span>Last saved: <span x-text="lastSaved"></span></span>
        <span x-text="currentFileName"></span>
    </div>

    <!-- Save Modal -->
    <div x-show="showSaveModal" class="modal-backdrop">
        <div class="modal-content">
            <h3 class="font-bold text-lg mb-4">Save Drawing</h3>
            <input type="text" x-model="saveFileName" placeholder="Enter file name" class="input input-bordered w-full mb-4">
            <div class="flex justify-end gap-2">
                <button @click="showSaveModal = false" class="btn">Cancel</button>
                <button @click="saveDrawing" class="btn btn-primary">Save</button>
            </div>
        </div>
    </div>

    <!-- Load Modal -->
    <div x-show="showLoadModal" class="modal-backdrop">
        <div class="modal-content">
            <h3 class="font-bold text-lg mb-4">Load Drawing</h3>
            <div class="max-h-60 overflow-y-auto">
                <template x-for="file in savedFiles" :key="file.name">
                    <div class="flex justify-between items-center p-2 hover:bg-gray-100 rounded">
                        <span x-text="file.name"></span>
                        <button @click="loadDrawing(file.name)" class="btn btn-sm">Load</button>
                    </div>
                </template>
            </div>
            <div class="flex justify-end mt-4">
                <button @click="showLoadModal = false" class="btn">Close</button>
            </div>
        </div>
    </div>
</div>

<script>
    document.addEventListener('alpine:init', () => {
        Alpine.data('excaliDrawEditor', () => ({
            lastSaved: 'Never',
            editorFrame: null,
            showSaveModal: false,
            showLoadModal: false,
            saveFileName: '',
            currentFileName: '',
            content: null,

            init() {
                if (localStorage.getItem('excalidraw-last-saved')) {
                    this.lastSaved = new Date(localStorage.getItem('excalidraw-last-saved')).toLocaleString();
                }

                this.initEditor();
                this.setupMessageHandling();
            },

            get savedFiles() {
                const files = [];
                for (let i = 0; i < localStorage.length; i++) {
                    const key = localStorage.key(i);
                    if (key.startsWith('excalidraw-file-')) {
                        files.push({
                            name: key.replace('excalidraw-file-', ''),
                            date: new Date(JSON.parse(localStorage.getItem(key)).savedAt).toLocaleString()
                        });
                    }
                }
                return files.sort((a, b) => b.date.localeCompare(a.date));
            },

            initEditor() {
                const container = document.getElementById('editor-container');
                container.innerHTML = `<iframe src="https://excalidraw.com/?embed=1"></iframe>`;
                this.editorFrame = container.querySelector('iframe');
            },

            setupMessageHandling() {
                window.addEventListener('message', (event) => {
                    try {
                        if (event.data && event.data.type === 'save') {
                            this.content = event.data.elements;
                        }
                    } catch (e) {
                        console.error('Error processing message:', e);
                    }
                });
            },

            saveDrawing() {
                if (!this.saveFileName) {
                    alert('Please enter a file name');
                    return;
                }

                const saveData = {
                    content: this.content,
                    savedAt: new Date().toISOString()
                };

                localStorage.setItem(`excalidraw-file-${this.saveFileName}`, JSON.stringify(saveData));
                this.lastSaved = new Date().toLocaleString();
                this.currentFileName = this.saveFileName;
                this.showSaveModal = false;
                this.saveFileName = '';
            },

            loadDrawing(fileName) {
                const saveData = JSON.parse(localStorage.getItem(`excalidraw-file-${fileName}`));
                if (saveData && saveData.content) {
                    this.editorFrame.contentWindow.postMessage({
                        type: 'load',
                        elements: saveData.content
                    }, '*');
                    this.currentFileName = fileName;
                    this.showLoadModal = false;
                }
            }
        }));
    });
</script>
</body>
</html>
