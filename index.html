<body x-data="main">
<div class="grid grid-cols-12">
    <div class="col-span-2 h-screen bg-neutral"
         x-import="navigation/notebook-selector;navigation/menu-actions;navigation/history">
        <ui-notebook-selector></ui-notebook-selector>
        <div x-show="!permissionIssue" x-cloak x-transition>
            <ui-actions></ui-actions>
            <ui-history></ui-history>
            <div>
                <div x-html="menuHTML"></div>
            </div>
        </div>
    </div>
    <div class="col-span-10" x-data="{level: $persist('landscape'), active_tab: $persist('C4'), selected: ''}">
        <div class="h-[5vh] w-full bg-neutral-content flex items-center justify-between gap-2"
             x-import="navigation/architecture-header">
            <ui-architecture-header></ui-architecture-header>
            <div>
                <button
                    x-data="pwaInstall()"
                    x-show="canInstall"
                    x-cloak
                    @click="install"
                    class="btn btn-primary btn-outline btn-circle btn-sm m-2">
                    <i class="fa-solid fa-download"></i>
                </button>
                <button class="btn btn-outline btn-success btn-sm btn-circle m-2 mr-5" @click="create_doc">
                    <i class="fa-solid fa-plus"></i>
                </button>
            </div>
        </div>
        <div class="p-5 max-h-[95vh] overflow-y-auto"
             x-import="micro-doc;architecture;all-documents;dashboard;infodeck">
            <template x-if="navigation == 'architecture'">
                <ui-architecture></ui-architecture>
            </template>
            <template x-if="navigation == 'doc' && microDoc.id">
                <ui-micro-doc></ui-micro-doc>
            </template>
            <template x-if="navigation == 'doc' && Object.keys(microDoc).length == 0">
                <div>
                    TODO: Home page
                </div>
            </template>
            <template x-if="navigation == 'dashboard'">
                <ui-dashboard></ui-dashboard>
            </template>
            <template x-if="navigation == 'infodecks'">
                <ui-infodecks></ui-infodecks>
            </template>
            <template x-if="navigation == 'search'">
                <ui-all-documents></ui-all-documents>
            </template>
        </div>
    </div>
</div>

<script src="/js/modules/DocumentEngine.js"></script>

<script>
  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("/service-worker.js")
      .then(() => console.log("Service Worker registered"))
      .catch(err => console.error("SW registration failed:", err));
  }
</script>
<script>
function pwaInstall() {
    return {
        canInstall: false,
        deferredPrompt: null,

        init() {
            window.addEventListener("beforeinstallprompt", (e) => {
                e.preventDefault();
                this.deferredPrompt = e;
                this.canInstall = true;   // Toon de knop
            });

            // Verbergen als gebruiker via browser-menu installeert
            window.addEventListener("appinstalled", () => {
                this.canInstall = false;
                this.deferredPrompt = null;
                console.log("PWA installed");
            });
        },

        async install() {
            if (!this.deferredPrompt) return;

            this.deferredPrompt.prompt();
            const result = await this.deferredPrompt.userChoice;

            if (result.outcome === "accepted") {
                console.log("User accepted the install");
            } else {
                console.log("User dismissed the install");
            }

            this.canInstall = false;
            this.deferredPrompt = null;
        }
    }
}
</script>
