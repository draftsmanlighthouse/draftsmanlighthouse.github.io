<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>The Architect’s Notebook</title>
    <link rel="icon" href="/favicon.png" type="image/png"/>

    <!-- AlpineJS & Vimesh -->
    <script defer src="https://cdn.jsdelivr.net/npm/@alpinejs/persist@3.x.x/dist/cdn.min.js"></script>
    <script src="/js/tp/vimeshui.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>

    <!-- cofig -->
    <script src="/js/config/setup.js"></script>

    <!-- DaisyUI -->
    <link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.10/dist/full.min.css" rel="stylesheet" type="text/css"/>
    <script src="/js/tp/tailwind.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>

    <!-- markdown -->
    <link rel="stylesheet" href="https://uicdn.toast.com/editor/latest/toastui-editor.min.css"/>
    <script src="https://uicdn.toast.com/editor/latest/toastui-editor-all.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/github-markdown-css/github-markdown.min.css">
    <style>[x-cloak] { display: none !important; }</style>

    <!-- mermaid -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mermaid/10.6.1/mermaid.min.js"></script>

    <!-- Chart.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>

    <!-- D3 -->
    <script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>

    <!-- cytoscape -->
    <script src="https://unpkg.com/dagre/dist/dagre.min.js"></script>
    <script src="https://unpkg.com/cytoscape-dagre/cytoscape-dagre.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.24.0/cytoscape.min.js"></script>
    <script src="/js/utils/c4-diagram.js"></script>

    <!-- minisearch -->
    <script src="/js/tp/minisearch.js"></script>
    <style>[x-cloak] { display: none !important; }</style>

    <script src="/js/utils/dbutil.js"></script>
    <script src="/js/utils/menu-generator.js"></script>
    <script src="/js/utils/time-utils.js"></script>
</head>
<body x-data="main">
<div class="grid grid-cols-12">
    <div class="col-span-2 h-screen bg-neutral" x-import="navigation/notebook-selector;navigation/menu-actions;navigation/history">
        <ui-notebook-selector></ui-notebook-selector>
        <div x-show="!permissionIssue" x-cloak x-transition>
            <ui-actions></ui-actions>
            <ui-history></ui-history>
            <div>
                <div x-html="menuHTML"></div>
            </div>
        </div>
    </div>
    <div class="col-span-10" x-data="{level: $persist('landscape'), active_tab: $persist('C4'), selected: ''}">
        <div class="h-[5vh] w-full bg-neutral-content flex items-center justify-between gap-2" x-import="navigation/architecture-header">
            <ui-architecture-header></ui-architecture-header>
            <button class="btn btn-outline btn-success btn-sm btn-circle m-2 mr-5" @click="create_doc">
                <i class="fa-solid fa-plus"></i>
            </button>
        </div>
        <div class="p-5 max-h-[95vh] overflow-y-auto" x-import="micro-doc;architecture;all-documents;dashboard;infodeck">
            <template x-if="navigation == 'architecture'">
                <ui-architecture></ui-architecture>
            </template>
            <template x-if="navigation == 'doc' && microDoc.id">
                <ui-micro-doc></ui-micro-doc>
            </template>
            <template x-if="navigation == 'doc' && Object.keys(microDoc).length == 0">
                <div>
                    TODO: Home page
                </div>
            </template>
            <template x-if="navigation == 'dashboard'">
                <ui-dashboard></ui-dashboard>
            </template>
            <template x-if="navigation == 'infodecks'">
                <ui-infodecks></ui-infodecks>
            </template>
            <template x-if="navigation == 'search'">
                <ui-all-documents></ui-all-documents>
            </template>
        </div>
    </div>
</div>

<script src="/js/modules/DocumentEngine.js"></script>
<script src="/js/modules/MicroDocUtils.js"></script>
<script src="/js/modules/MarkdownEditor.js"></script>
<script src="/js/modules/DrawioEditor.js"></script>
<script src="/js/modules/MermaidEditor.js"></script>
<script src="/js/modules/ChartEditor.js"></script>
<script src="/js/modules/NodeDiagram.js"></script>
<script src="/js/modules/ArchitectureDiagram.js"></script>
<script src="/js/modules/SearchEngine.js"></script>
</body>
</html>
