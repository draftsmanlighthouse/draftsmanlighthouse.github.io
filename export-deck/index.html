<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>

    <link href="/export-deck/pdf.css" rel="stylesheet"/>

    <!-- Alpine for toggling export-mode -->
    <script src="/js/tp/vimeshui.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>

    <link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.10/dist/full.min.css" rel="stylesheet" type="text/css"/>
    <script src="/js/tp/tailwind.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>

    <!-- Render libraries -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/github-markdown-css/github-markdown.min.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mermaid/10.6.1/mermaid.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>

    <!-- Export helper -->
    <script src="/export-deck/export-helper.js"></script>

    <script>
        $vui.config = {
          namespace: "ui",
        };
    </script>

</head>

<body x-data="{buttons: true,deck: JSON.parse(localStorage.deck)}"
      class="export-landscape">

<template x-component="slide-component">
    <div x-data="{section: {}}" x-init="section = slide.sections[$prop('section')]">

        <template x-if="section.type == 'markdown'">
            <div class="markdown-body prose max-w-none bg-transparent" x-html="marked.parse(section.data)"></div>
        </template>

        <template x-if="['drawio','sketch'].includes(section.type)">
            <div x-init="$el.closest('.content-container').classList.remove('flex')">
                <iframe @load="load_diagram($el,section.data)"
                        frameborder="0" class="w-full"
                        :style="`background: transparent;aspect-ratio: ${section.width} / ${section.height}`"
                        src="https://notebook.bohanssen.com/diagram/viewer?embed=1&ui=min&spin=1&proto=json"></iframe>
            </div>
        </template>

        <template x-if="section.type == 'image'">
            <img :class="$prop('height') ? $prop('height') : 'h-[44vh]'" class="rounded" :src="section.data"></img>
        </template>

        <template x-if="section.type == 'chart'">
            <div>
                <template x-if="['chart','both'].includes(section.view_mode)">
                    <div class="w-full h-full" :class="`max-w-[${$el.closest('.content-container').clientWidth/2}px]`">
                        <canvas class="w-[90%] h-[90%]" :id="section.id"
                                x-init="load_chart($el,section);"></canvas>
                    </div>
                </template>
                <template x-if="['table','both'].includes(section.view_mode)">
                    <div x-init="load_table($el,section)"></div>
                </template>
            </div>
        </template>

        <template x-if="section.type == 'mermaid'">
            <pre class="mermaid" x-text="section.data"></pre>
        </template>

        <template x-if="section.type == 'table'">
            <div x-data="tableEditor">
                <table class="table">
                    <template x-for="row in [...Array(section.rows).keys()]" :key="row">
                        <tr>
                            <template x-for="col in [...Array(section.cols).keys()]" :key="row + '-' + col">

                                <td
                                        :style="{
                                backgroundColor: get_cell(row,col).bg ?? '',
                                color: get_cell(row,col).color ?? ''
                            }"

                                        :class="[
                                'border border-base-200',
                                ((col === 0 && section.header?.row) || (row === 0 && section.header?.col))
                                    ? 'bg-base-200 font-semibold text-base-content/80 border-base-300 text-lg'
                                    : '',
                                get_cell(row,col).bold ? 'font-bold' : '',
                                get_cell(row,col).italic ? 'italic' : '',
                            ]"
                                        x-text="get_cell(row,col).value"
                                ></td>

                            </template>
                        </tr>
                    </template>
                </table>
            </div>
        </template>

    </div>
</template>

<!-- Slides rendered here -->
