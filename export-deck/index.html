<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>

    <link href="/export-deck/pdf.css" rel="stylesheet"/>

    <!-- Alpine for toggling export-mode -->
    <script src="/js/tp/vimeshui.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>

    <link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.10/dist/full.min.css" rel="stylesheet" type="text/css"/>
    <script src="/js/tp/tailwind.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>

    <!-- Render libraries -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mermaid/10.6.1/mermaid.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>

    <!-- Export helper -->
    <script src="/export-deck/export-helper.js"></script>

    <script>
        $vui.config = {
          namespace: "ui",
        };
    </script>

</head>

<body x-data="{buttons: true,deck: JSON.parse(localStorage.deck)}"
      class="export-landscape"
      x-init="await prepare()">

<template x-component="slide-component">
    <div class="max-h-[500px] max-w-[500px] overflow-auto">
        <pre x-text="JSON.stringify(slide.sections[$prop('section')],null,2)"></pre>
    </div>

</template>

<!-- Slides rendered here -->
<template x-for="slide in deck">
    <div class="h-[100vh] max-h-[100vh] w-[100vw] max-w-[100vw] overflow-none m-0"
         :style="'background' in slide.sections ? `background-image: url('${slide.sections.background.data}')` : ''">
        <h1 class="mt-0 mb-5 mx-5 text-3xl" x-text="slide.title"></h1>

        <div x-show="buttons" class="absolute top-5 right-5">
            <button class="btn btn-neutral" @click="buttons=false;
                    setTimeout(async () => {
                      window.print();
                      window.close();
                    }, 200)">
                Save PDF
            </button>
        </div>

        <template x-if="slide.layout == 'A'">
            <div class="grid grid-cols-12 gap-3 h-[88vh]">
                <div class="col-span-6 flex items-center justify-center content-container">
                    <ui-slide-component section="A"></ui-slide-component>
                </div>
                <div class="col-span-6 flex items-center justify-center content-container">
                    <ui-slide-component section="B"></ui-slide-component>
                </div>
            </div>
        </template>

        <template x-if="slide.layout == 'B'">
            <div class="grid grid-cols-12 gap-3 h-[88vh]">
                <div class="col-span-7 flex items-center justify-center content-container">
                    <ui-slide-component section="A"></ui-slide-component>
                </div>
                <div class="col-span-5 flex items-center justify-center content-container">
                    <ui-slide-component section="B"></ui-slide-component>
                </div>
            </div>
        </template>

        <template x-if="slide.layout == 'C'">
            <div class="grid grid-cols-12 gap-3 h-[88vh]">
                <div class="col-span-5 flex items-center justify-center content-container">
                    <ui-slide-component section="A"></ui-slide-component>
                </div>
                <div class="col-span-7 flex items-center justify-center content-container">
                    <ui-slide-component section="B"></ui-slide-component>
                </div>
            </div>
        </template>

        <template x-if="slide.layout == 'D'">
            <div class="grid grid-cols-12 gap-3 h-[88vh]">
                <div class="col-span-6 flex items-center justify-center content-container">
                    <ui-slide-component section="A"></ui-slide-component>
                </div>
                <div class="col-span-6">
                    <div class="h-[44vh] flex items-center justify-center content-container">
                        <ui-slide-component section="B"></ui-slide-component>
                    </div>
                    <div class="h-[44vh] flex items-center justify-center content-container">
                        <ui-slide-component section="C"></ui-slide-component>
                    </div>
                </div>
            </div>
        </template>

        <template x-if="slide.layout == 'E'">
            <div class="grid grid-cols-12 gap-3 h-[88vh]">
                <div class="col-span-6">
                    <div class="h-[44vh] flex items-center justify-center content-container">
                        <ui-slide-component section="A"></ui-slide-component>
                    </div>
                    <div class="h-[44vh] flex items-center justify-center content-container">
                        <ui-slide-component section="B"></ui-slide-component>
                    </div>
                </div>
                <div class="col-span-6 flex items-center justify-center content-container">
                    <ui-slide-component section="C"></ui-slide-component>
                </div>
            </div>
        </template>

        <template x-if="slide.layout == 'F'">
            <div class="grid grid-cols-12 gap-3 h-[88vh]">
                <div class="col-span-6">
                    <div class="h-[44vh] flex items-center justify-center content-container">
                        <ui-slide-component section="A"></ui-slide-component>
                    </div>
                    <div class="h-[44vh] flex items-center justify-center content-container">
                        <ui-slide-component section="B"></ui-slide-component>
                    </div>
                </div>
                <div class="col-span-6">
                    <div class="h-[44vh] flex items-center justify-center content-container">
                        <ui-slide-component section="C"></ui-slide-component>
                    </div>
                    <div class="h-[44vh] flex items-center justify-center content-container">
                        <ui-slide-component section="D"></ui-slide-component>
                    </div>
                </div>
            </div>
        </template>

        <template x-if="slide.layout == 'G'">
            <div class="grid grid-cols-12 gap-3 h-[88vh]">
                <div class="col-span-12 flex items-center justify-center content-container">
                    <ui-slide-component section="A"></ui-slide-component>
                </div>
            </div>
        </template>

        <template x-if="slide.layout == 'H'">
            <div>
                <div class="grid grid-cols-12 gap-3 h-[44vh]">
                    <div class="col-span-12 flex items-center justify-center content-container">

                    </div>
                </div>
                <div class="grid grid-cols-12 gap-3 h-[44vh]">
                    <div class="col-span-6 flex items-center justify-center content-container">
                        <ui-slide-component section="B"></ui-slide-component>
                    </div>
                    <div class="col-span-6 flex items-center justify-center content-container">
                        <ui-slide-component section="C"></ui-slide-component>
                    </div>
                </div>
            </div>
        </template>

        <template x-if="slide.layout == 'I'">
            <div>
                <div class="grid grid-cols-12 gap-3 h-[44vh]">
                    <div class="col-span-6 flex items-center justify-center content-container">
                        <ui-slide-component section="B"></ui-slide-component>
                    </div>
                    <div class="col-span-6 flex items-center justify-center content-container">
                        <ui-slide-component section="C"></ui-slide-component>
                    </div>
                </div>
                <div class="grid grid-cols-12 gap-3 h-[44vh]">
                    <div class="col-span-12 flex items-center justify-center content-container">
                        <ui-slide-component section="A"></ui-slide-component>
                    </div>
                </div>
            </div>
        </template>

        <template x-if="slide.layout == 'J'">
            <div>
                <div class="grid grid-cols-12 gap-3 h-[44vh]">
                    <div class="col-span-12 flex items-center justify-center content-container">
                        <ui-slide-component section="A"></ui-slide-component>
                    </div>
                </div>
                <div class="grid grid-cols-12 gap-3 h-[44vh]">
                    <div class="col-span-4 flex items-center justify-center content-container">
                        <ui-slide-component section="B"></ui-slide-component>
                    </div>
                    <div class="col-span-4 flex items-center justify-center content-container">
                        <ui-slide-component section="C"></ui-slide-component>
                    </div>
                    <div class="col-span-4 flex items-center justify-center content-container">
                        <ui-slide-component section="D"></ui-slide-component>
                    </div>
                </div>
            </div>
        </template>

        <template x-if="slide.layout == 'K'">
            <div class="grid grid-cols-12 gap-3 h-[88vh]">
                <div class="col-span-4 flex items-center justify-center content-container">
                    <ui-slide-component section="A"></ui-slide-component>
                </div>
                <div class="col-span-4 flex items-center justify-center content-container">

        <template x-if="slide.layout == 'L'">

                    <div class="col-span-4 flex items-center justify-center content-container">

                    </div>
                    <div class="col-span-4 flex items-center justify-center content-container">
                        <ui-slide-component section="B"></ui-slide-component>
                    </div>
                    <div class="col-span-4 flex items-center justify-center content-container">
                        <ui-slide-component section="C"></ui-slide-component>
                    </div>
                </div>
                <div class="grid grid-cols-12 gap-3 h-[44vh]">
                    <div class="col-span-4 flex items-center justify-center content-container">
                        <ui-slide-component section="D"></ui-slide-component>
                    </div>
                    <div class="col-span-4 flex items-center justify-center content-container">
                        <ui-slide-component section="E"></ui-slide-component>
                    </div>
                    <div class="col-span-4 flex items-center justify-center content-container">
                        <ui-slide-component section="F"></ui-slide-component>
                    </div>
                </div>
            </div>
        </template>

        <template x-if="slide.layout == 'M'">
            <div>
                <div class="grid grid-cols-12 gap-3 h-[30vh]">
                    <div class="col-span-4 flex items-center justify-center content-container">
                        <ui-slide-component section="A"></ui-slide-component>
                    </div>
                    <div class="col-span-4 flex items-center justify-center content-container">
                        <ui-slide-component section="B"></ui-slide-component>
                    </div>
                    <div class="col-span-4 flex items-center justify-center content-container">
                        <ui-slide-component section="C"></ui-slide-component>
                    </div>
                </div>
                <div class="grid grid-cols-12 gap-3 h-[30vh]">
                    <div class="col-span-4 flex items-center justify-center content-container">
                        <ui-slide-component section="D"></ui-slide-component>
                    </div>
                    <div class="col-span-4 flex items-center justify-center content-container">
                        <ui-slide-component section="E"></ui-slide-component>
                    </div>
                    <div class="col-span-4 flex items-center justify-center content-container">
                        <ui-slide-component section="F"></ui-slide-component>
                    </div>
                </div>
                <div class="grid grid-cols-12 gap-3 h-[30vh]">
                    <div class="col-span-4 flex items-center justify-center content-container">
                        <ui-slide-component section="G"></ui-slide-component>
                    </div>
                    <div class="col-span-4 flex items-center justify-center content-container">
                        <ui-slide-component section="H"></ui-slide-component>
                    </div>
                    <div class="col-span-4 flex items-center justify-center content-container">
                        <ui-slide-component section="I"></ui-slide-component>
                    </div>
                </div>
            </div>
        </template>

        <template x-if="slide.layout == 'N'">
            <div>
                <div class="grid grid-cols-12 gap-3 h-[44vh]">
                    <div class="col-span-8 flex items-center justify-center content-container">
                        <ui-slide-component section="A"></ui-slide-component>
                    </div>
                    <div class="col-span-4 flex items-center justify-center content-container">
                        <ui-slide-component section="B"></ui-slide-component>
                    </div>
                </div>
                <div class="grid grid-cols-12 gap-3 h-[44vh]">
                    <div class="col-span-4 flex items-center justify-center content-container">
                        <ui-slide-component section="C"></ui-slide-component>
                    </div>
                    <div class="col-span-8 flex items-center justify-center content-container">
                        <ui-slide-component section="D"></ui-slide-component>
                    </div>
                </div>
            </div>
        </template>

        <template x-if="slide.layout == 'O'">
            <div>
                <div class="grid grid-cols-12 gap-3 h-[44vh]">
                    <div class="col-span-4 flex items-center justify-center content-container">
                        <ui-slide-component section="B"></ui-slide-component>
                    </div>
                    <div class="col-span-4 flex items-center justify-center content-container">
                        <ui-slide-component section="C"></ui-slide-component>
                    </div>
                    <div class="col-span-4 flex items-center justify-center content-container">
                        <ui-slide-component section="D"></ui-slide-component>
                    </div>
                </div>
                <div class="grid grid-cols-12 gap-3 h-[44vh]">
                    <div class="col-span-12 flex items-center justify-center content-container">
                        <ui-slide-component section="A"></ui-slide-component>
                    </div>
                </div>
            </div>
        </template>

    </div>
</template>

</body>
</html>
