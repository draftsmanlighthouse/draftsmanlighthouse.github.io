<!DOCTYPE html>
<html data-theme="light">
<head>
    <title>Markdown Editor</title>
    <script defer src="https://cdnjs.cloudflare.com/ajax/libs/alpinejs/3.13.5/cdn.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/11.1.1/marked.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/daisyui/4.7.2/full.min.css" rel="stylesheet" type="text/css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css" rel="stylesheet">
</head>
<body x-data="markdownEditor" class="container mx-auto p-4 max-w-6xl">
<div class="flex flex-col gap-4">
    <!-- Header with controls -->
    <div class="flex justify-between items-center">
        <h1 class="text-2xl font-bold">Markdown Editor</h1>
        <div class="flex gap-2">
            <div class="btn-group">
                <button
                        @click="mode = 'edit'"
                        :class="{ 'btn-active': mode === 'edit' }"
                        class="btn btn-sm">
                    Edit
                </button>
                <button
                        @click="mode = 'split'"
                        :class="{ 'btn-active': mode === 'split' }"
                        class="btn btn-sm">
                    Split
                </button>
                <button
                        @click="mode = 'preview'"
                        :class="{ 'btn-active': mode === 'preview' }"
                        class="btn btn-sm">
                    Preview
                </button>
            </div>
            <div class="dropdown dropdown-end">
                <button class="btn btn-sm">Theme</button>
                <ul class="dropdown-content z-10 menu p-2 shadow bg-base-100 rounded-box w-52 max-h-80 overflow-y-auto">
                    <template x-for="theme in themes" :key="theme">
                        <li>
                            <a
                                    @click="changeTheme(theme)"
                                    :class="{ 'active': currentTheme === theme }"
                                    x-text="theme">
                            </a>
                        </li>
                    </template>
                </ul>
            </div>
        </div>
    </div>

    <!-- Editor Area -->
    <div class="flex gap-4 h-[70vh]" :class="{'flex-col': mode === 'split'}">
        <!-- Edit panel -->
        <div
                x-show="mode === 'edit' || mode === 'split'"
                :class="mode === 'split' ? 'h-1/2' : 'w-full'"
                class="flex flex-col gap-2"
        >
                <textarea
                        x-model="content"
                        @input="autoSave"
                        class="textarea textarea-bordered flex-grow font-mono"
                        placeholder="Enter your markdown here..."
                ></textarea>
        </div>

        <!-- Preview panel -->
        <div
                x-show="mode === 'preview' || mode === 'split'"
                :class="mode === 'split' ? 'h-1/2' : 'w-full'"
                class="prose max-w-none border rounded-lg p-4 overflow-y-auto bg-base-100"
                x-html="renderMarkdown()"
        ></div>
    </div>

    <!-- Status Bar -->
    <div class="flex justify-between text-sm opacity-70">
        <span>Last saved: <span x-text="lastSaved"></span></span>
        <span>Characters: <span x-text="content.length"></span></span>
    </div>
</div>

<script>
    document.addEventListener('alpine:init', () => {
        Alpine.data('markdownEditor', () => ({
            content: localStorage.getItem('markdown-content') || '# Welcome to the Markdown Editor\n\nStart typing your markdown here...',
            mode: 'split',
            lastSaved: 'Never',
            currentTheme: 'light',
            themes: ['light', 'dark', 'cupcake', 'bumblebee', 'emerald', 'corporate', 'synthwave', 'retro', 'cyberpunk', 'valentine', 'halloween', 'garden', 'forest', 'aqua', 'lofi', 'pastel', 'fantasy', 'wireframe', 'black', 'luxury', 'dracula', 'cmyk', 'autumn', 'business', 'acid', 'lemonade', 'night', 'coffee', 'winter'],

            init() {
                marked.setOptions({
                    highlight: (code, lang) => {
                        if (lang && hljs.getLanguage(lang)) {
                            return hljs.highlight(code, { language: lang }).value;
                        }
                        return hljs.highlightAuto(code).value;
                    },
                    breaks: true,
                    gfm: true
                });

                // Initialize the theme from localStorage or default
                this.currentTheme = localStorage.getItem('markdown-theme') || 'light';
                this.changeTheme(this.currentTheme);

                // Set initial last saved time if content exists
                if (localStorage.getItem('markdown-content')) {
                    this.lastSaved = new Date(localStorage.getItem('markdown-last-saved')).toLocaleString();
                }
            },

            renderMarkdown() {
                return marked.parse(this.content);
            },

            autoSave() {
                localStorage.setItem('markdown-content', this.content);
                this.lastSaved = new Date().toLocaleString();
                localStorage.setItem('markdown-last-saved', new Date().toISOString());
            },

            changeTheme(theme) {
                this.currentTheme = theme;
                document.documentElement.setAttribute('data-theme', theme);
                localStorage.setItem('markdown-theme', theme);
            }
        }));
    });
</script>
</body>
</html>
