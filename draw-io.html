<!DOCTYPE html>
<html>
<head>
    <title>Diagram Viewer/Editor</title>
    <script defer src="https://cdnjs.cloudflare.com/ajax/libs/alpinejs/3.13.5/cdn.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 1200px;
            margin: 20px auto;
            padding: 0 20px;
        }
        .container {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .controls {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        .iframe-container {
            display: none;
            border: 1px solid #ccc;
            min-height: 600px;
        }
        .iframe-container.active {
            display: block;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
            width: fit-content;
        }
        button:hover {
            background-color: #45a049;
        }
        select {
            padding: 8px 16px;
            font-size: 16px;
            border-radius: 4px;
            border: 1px solid #ccc;
        }
    </style>
</head>
<body x-data="diagramEditor">
<h1>Diagram Viewer/Editor</h1>
<div class="container">
    <div class="controls" x-show="!isEditing">
        <button @click="startEditing">Edit Diagram</button>
        <select x-model="selectedMode">
            <template x-for="mode in editorModes" :key="mode.value">
                <option :value="mode.value" x-text="mode.label"></option>
            </template>
        </select>
    </div>

    <div
            id="diagram-container"
            class="iframe-container"
            :class="{ 'active': !isEditing }"
    ></div>

    <div
            id="editor-container"
            class="iframe-container"
            :class="{ 'active': isEditing }"
    ></div>
</div>

<script>
    document.addEventListener('alpine:init', () => {
        Alpine.data('diagramEditor', () => ({
            isEditing: false,
            currentDiagram: localStorage.getItem('savedDiagram') || '<mxGraphModel><root><mxCell id="0"/><mxCell id="1" parent="0"/></root></mxGraphModel>',
            editorFrame: null,
            selectedMode: 'default',
            editorModes: [
                //{ value: 'default', label: 'Default' },
                { value: 'minimal', label: 'Default' },
                { value: 'sketch', label: 'Sketch' },
                //{ value: 'atlas', label: 'Atlas' },
                //{ value: 'dark', label: 'Dark Theme' },
                //{ value: 'kennedy', label: 'Kennedy' },
                { value: 'min', label: 'Minimal' },
                //{ value: 'browser', label: 'Browser Style' }
            ],

            init() {
                this.displayDiagram();
                this.setupMessageHandling();
            },

            displayDiagram() {
                const viewer = 'https://viewer.diagrams.net/?embed=1&ui=min&spin=1&proto=json';
                const container = document.getElementById('diagram-container');

                container.innerHTML = `<iframe frameborder="0" style="width:100%;height:600px;" src="${viewer}"></iframe>`;

                const iframe = container.querySelector('iframe');
                iframe.addEventListener('load', () => {
                    iframe.contentWindow.postMessage(JSON.stringify({
                        action: 'load',
                        xml: this.currentDiagram
                    }), '*');
                });
            },

            getEditorUrl() {
                const baseUrl = 'https://embed.diagrams.net/?embed=1&spin=1&modified=unsavedChanges&proto=json';
                return this.selectedMode === 'default'
                    ? baseUrl
                    : `${baseUrl}&ui=${this.selectedMode}`;
            },

            initEditor() {
                const container = document.getElementById('editor-container');
                container.innerHTML = `<iframe frameborder="0" style="width:100%;height:600px;" src="${this.getEditorUrl()}"></iframe>`;
                this.editorFrame = container.querySelector('iframe');
            },

            startEditing() {
                this.isEditing = true;
                // Always reinitialize editor to apply new mode
                this.initEditor();
            },

            switchToViewMode() {
                this.isEditing = false;
                this.displayDiagram();
            },

            setupMessageHandling() {
                window.addEventListener('message', (evt) => {
                    if (evt.data.length > 0) {
                        try {
                            const msg = JSON.parse(evt.data);

                            if (msg.event === 'save') {
                                this.currentDiagram = msg.xml;
                                localStorage.setItem('savedDiagram', this.currentDiagram);
                                this.switchToViewMode();
                            }

                            if (msg.event === 'init') {
                                evt.source.postMessage(JSON.stringify({
                                    action: 'load',
                                    xml: this.currentDiagram
                                }), '*');
                            }

                            if (msg.event === 'exit') {
                                this.switchToViewMode();
                            }

                        } catch (e) {
                            console.error('Error processing message:', e);
                        }
                    }
                });
            }
        }));
    });
</script>
</body>
</html>
