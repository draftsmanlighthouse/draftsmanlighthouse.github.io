<template x-component="markdown">
    <div>
        <template x-if="!$prop('deck')">
            <div x-data="markdown">
                <div x-show="isEditing" style="height: calc(60vh)">
                    <div @click.outside="if(isEditing){toggleMode()}" x-ref="editor" class="h-full"></div>
                </div>
                <div
                        @click="toggleMode"
                        x-show="!isEditing"
                        class="markdown-body prose max-w-none bg-transparent"
                        x-html="renderedMarkdown"></div>
            </div>
        </template>
        <template x-if="$prop('deck')">
            <div x-data="markdown">

                <dialog x-ref="markdown_editor" class="modal">
                    <div class="modal-box w-[80vw] max-w-[80vw]">
                        <h3 class="text-lg font-bold">Edit text</h3>
                        <div style="height: calc(60vh)">
                            <div @keyup.debounce="sync" x-ref="editor" class="h-full"></div>
                        </div>
                    </div>
                    <form method="dialog" class="modal-backdrop">
                        <button>close</button>
                    </form>
                </dialog>

                <div @click="$refs.markdown_editor.showModal()"
                     class="markdown-body prose max-w-none bg-transparent"
                     x-html="renderedMarkdown"></div>
            </div>
        </template>
    </div>
</template>
<template x-component="markdown-readonly">
    <div x-data="markdown">
        <div
                class="markdown-body max-w-none bg-transparent"
                x-html="renderedMarkdown"></div>
    </div>
</template>
