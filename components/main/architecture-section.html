<template x-component="architecture-section">
    <div class="m-5"
         x-data="{level: $persist('enterprise')}"
         x-show="navigation == 'architecture'" x-cloak x-transition>

        <div x-show="active_tab == 'C4'" x-cloak x-transition
             x-data="C4Diagram"
             class="mt-5">
            <template x-if="active_tab == 'C4'">
                <div x-init="draw(level,c4_data)">
                    <div id="c4" class="w-full h-[90vh]"></div>
                </div>
            </template>
        </div>

        <div x-show="active_tab == 'principles'" x-cloak x-transition class="mt-5">

            <template x-if="level == 'enterprise'">
                <template x-for="principle in Object.values(documents).filter(x => x.type == 'principle' && x.scope == 'enterprise')"
                          :key="principle.id">
                    <div class="collapse collapse-arrow bg-base-100 border border-base-300 mb-2">
                      <input type="radio" name="principles" />
                      <div class="collapse-title font-semibold" x-text="principle.title"></div>
                      <div class="collapse-content text-sm">
                        <div
                                x-data="{content: '', readonly: true}"
                                x-init="content = principle.principle ? principle.principle : PRINCIPLE"
                                x-import="doc-sections/markdown">
                            <ui-markdown></ui-markdown>
                        </div>
                        <a class="btn btn-outline btn-primary btn-sm mt-5"
                                :href="'#' + principle.id">
                            Open
                        </a>
                      </div>
                    </div>
                </template>
            </template>

        </div>

        <div x-show="active_tab == 'decisions'" x-cloak x-transition
             class="grid grid-cols-12 mt-5 gap-5">
            <div class="col-span-11">
                <table class="table table-pin-rows">
                    <tr>
                        <th></th>
                        <th>Name</th>
                        <th>Type</th>
                        <th>Status</th>
                        <th>Summary</th>
                    </tr>
                    <template
                            x-for="decision in Object.values(documents).filter(x => x.type == 'DD' || x.type == 'ADR')" :key="decision.id">
                        <tr>
                            <th x-text="decision.sequence_number"></th>
                            <td x-text="decision.title"></td>
                            <td>
                                <div x-show="decision.type == 'DD'" x-cloak x-transition
                                     class="badge badge-outline badge-info">Design Decision
                                </div>
                                <div x-show="decision.type == 'ADR'" x-cloak x-transition
                                     class="badge badge-outline badge-primary">Architecture Decision Record
                                </div>
                            </td>
                            <td>
                                <div x-show="decision.status == 'decided'" x-cloak x-transition
                                     class="badge badge-success">decided
                                </div>
                                <div x-show="decision.status == 'rejected'" x-cloak x-transition
                                     class="badge badge-error">rejected
                                </div>
                                <div x-show="decision.status == 'draft'" x-cloak x-transition
                                     class="badge badge-neutral">draft
                                </div>
                                <div x-show="decision.status == 'review'" x-cloak x-transition
                                     class="badge badge-warning">decided
                                </div>
                            </td>
                            <td>
                                <div
                                        x-data="{content: '', readonly: true}"
                                        x-init="content = decision.decision ? decision.decision : 'short summary of **problem** and **decision**'"
                                        x-import="doc-sections/markdown">
                                    <ui-markdown></ui-markdown>
                                </div>
                            </td>
                            <td>
                                    <a class="btn btn-ghost btn-xs"
                                            :href="'#' + decision.id">
                                        go to
                                    </a>
                                </td>
                        </tr>
                    </template>
                </table>
            </div>
        </div>

    </div>
</template>
