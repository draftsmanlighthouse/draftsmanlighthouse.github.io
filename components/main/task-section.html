<template x-component="task-section">
    <div class="m-5" x-show="active_tab == 'tasks'" x-cloak x-transition
         x-data="taskBoard" x-effect="tasks = get_work_items(documents)">
        <h1 class="text-6xl"><span x-text="current.title"></span> items</h1>

        <div class="navbar bg-base-200 shadow-sm rounded-box my-5">
            <div class="navbar-start">
                <label class="swap swap-rotate btn btn-circle btn-ghost">
                    <input type="checkbox" x-model="show_board"/>
                    <i class="fa-solid fa-angles-up swap-on"></i>
                    <i class="fa-solid fa-angles-down swap-off"></i>
                </label>
                <label class="swap swap-rotate btn btn-circle btn-ghost">
                    <input type="checkbox" x-model="show_list"/>
                    <i class="fa-solid fa-table-columns swap-on"></i>
                    <i class="fa-solid fa-list-check swap-off"></i>
                </label>
            </div>

            <div class="navbar-center">
                <input type="text" placeholder="Search" x-model="search"
                       x-effect="text_filter(search)"
                       class="input input-bordered w-24 md:w-auto"/>
                <ul class="menu menu-horizontal px-1">
                    <li>
                        <details>
                            <summary>Add item</summary>
                            <ul class="bg-base-100 rounded-t-none border-[#00AAAA] border-2 p-2">
                                <li><a @click="create_decision(current.id)">New decision</a></li>
                                <li><a @click="create_principle(current.id)">New architecture principle</a></li>
                                <li><a @click="create_persona(current.id)">New persona</a></li>
                            </ul>
                        </details>
                    </li>
                </ul>
            </div>

            <div class="navbar-end">

<!--                <label class="swap swap-rotate">-->
<!--                    <input type="checkbox" x-model="show_done"/>-->
<!--                    <i class="fa-solid fa-angles-right swap-on"></i>-->
<!--                    <i class="fa-solid fa-angles-left swap-off"></i>-->
<!--                </label>-->
            </div>
        </div>

        <div x-show="!show_list" x-cloak x-transition>
            <div class="grid gap-4" :class="show_done ? 'grid-cols-4' : 'grid-cols-3'"
                 x-show="show_board" x-cloak x-transition>
                <template x-for="(column, key) in columns" :key="key">
                    <template x-if="key != 'done' || show_done">
                        <div class="bg-base-200 p-3 rounded-xl shadow-sm flex flex-col">
                            <h2 class="font-bold mb-2 text-lg" x-text="column.title"></h2>

                            <div
                                    class="flex-none space-y-2 min-h-[150px] overflow-y-auto transition-all"
                                    :style="key === 'done' ? 'height:300px;' : 'height:400px;'"
                                    :id="key"
                                    x-init="initSortable($el, key)">
                                <template x-for="task in filteredTasks(key)" :key="task.id">
                                    <div
                                            class="card bg-[#00AEAE] p-3 shadow-sm border transition relative cursor-pointer"
                                            :class="selected == task.id ? 'border-[#008080] border-8' : 'border-transparent hover:border-primary'"
                                            @click="selected = task.id"
                                            x-show="ids.length == 0 || ids.includes(task.id)" x-cloak x-transition
                                            :data-id="task.id"
                                    >
                                        <div class="absolute top-1 right-1 text-base-content/60 hover:text-primary cursor-grab handle">
                                            ≡
                                        </div>
                                        <p class="font-semibold text-sm pr-6" x-text="task.title"></p>
                                    </div>
                                </template>
                            </div>

                            <!-- Done + Rejected -->
                            <template x-if="key === 'done'">
                                <div class="mt-3 border-t pt-2">
                                    <h3 class="text-sm opacity-70 mb-1">Rejected</h3>
                                    <div id="rejected" x-init="initSortable($el, 'rejected')"
                                         class="space-y-2 min-h-[50px] max-h-[100px] overflow-y-auto">
                                        <template x-for="task in filteredTasks('rejected')" :key="task.id">
                                            <div
                                                    class="card bg-error/10 p-3 border border-error/30 shadow-sm relative"
                                                    x-show="ids.length == 0 || ids.includes(task.id)" x-cloak x-transition
                                                    :data-id="task.id"
                                            >
                                                <div class="absolute top-1 right-1 text-error cursor-grab handle">≡
                                                </div>
                                                <p class="font-semibold text-sm line-through pr-6"
                                                   x-text="task.title"></p>
                                            </div>
                                        </template>
                                    </div>
                                </div>
                            </template>
                        </div>
                    </template>

                </template>
            </div>
        </div>

        <div x-show="show_list && show_board" x-cloak x-transition>
            <table class="table table-pin-rows">
                <tr>
                    <th>Name</th>
                    <th>Type</th>
                    <th>Prio</th>
                    <th>Status</th>
                </tr>
                <template x-for="sub in get_work_items(documents)" :key="sub.id">
                    <template x-if="current.id == sub.parent">
                        <tr x-show="ids.length == 0 || ids.includes(sub.id)" x-cloak x-transition
                            :class="selected == sub.id ? 'border-[#008080] border-4' : 'border-transparent hover:border-primary'">
                            <td class="cursor-pointer" @click="selected = sub.id"x-text="sub.title"></td>
                            <td>
                                <div x-show="sub.type == 'DD'" x-cloak x-transition
                                     class="badge badge-outline badge-info">DD
                                </div>
                                <div x-show="sub.type == 'ADR'" x-cloak x-transition
                                     class="badge badge-outline badge-warning">ADR
                                </div>
                                <div x-show="sub.type == 'persona'" x-cloak x-transition
                                     class="badge badge-outline badge-success">Persona
                                </div>
                                <div x-show="sub.type == 'principle' && sub.scope == 'enterprise'" x-cloak
                                     x-transition
                                     class="badge badge-outline badge-primary whitespace-nowrap">EAP
                                </div>
                                <div x-show="sub.type == 'principle' && sub.scope != 'enterprise' && component_reverse_index[sub.scope].split(':').length == 1"
                                     x-cloak x-transition
                                     class="badge badge-outline badge-secondary whitespace-nowrap">SAP
                                </div>
                                <div x-show="sub.type == 'principle' && sub.scope != 'enterprise' && component_reverse_index[sub.scope].split(':').length == 2"
                                     x-cloak
                                     x-transition
                                     class="badge badge-outline badge-accent whitespace-nowrap">CAP
                                </div>
                            </td>
                            <td x-init="sub.prio = sub.prio ? sub.prio : 0"
                                x-data="{prio: {0: 'select-primary', 1: 'select-accent', 2: 'select-info', 3: 'select-ghost'}}">
                                <select x-model="sub.prio"
                                        :class="prio[sub.prio]"
                                        class="select select-xs">
                                    <option value="0">Must have</option>
                                    <option value="1">Should have</option>
                                    <option value="2">Could have</option>
                                    <option value="3">Won't have</option>
                                </select>
                            </td>
                            <td
                                    x-data="{status: {
                                        'draft':'select-primary',
                                        'review': 'select-warning',
                                        'decided': 'select-success',
                                        'rejected': 'select-error',
                                        'published': 'select-success',
                                        'deleted': 'select-error'
                                    }}">

                                <template x-if="['DD','ADR'].includes(sub.type)">
                                    <select x-model="sub.status"
                                            :class="status[sub.status]"
                                            class="select select-xs w-full">
                                        <option>draft</option>
                                        <option>review</option>
                                        <option>decided</option>
                                        <option>rejected</option>
                                    </select>
                                </template>

                                <template x-if="['principle','persona'].includes(sub.type)">
                                    <select x-model="sub.status"
                                            :class="status[sub.status]"
                                            class="select select-xs w-full">
                                        <option>draft</option>
                                        <option>review</option>
                                        <option>published</option>
                                        <option>deleted</option>
                                    </select>
                                </template>

                            </td>
                            <td>
                                <a class="btn btn-ghost btn-xs"
                                   target="_blank"
                                   :href="'#' + sub.id">
                                    open tab
                                </a>
                            </td>
                        </tr>
                    </template>
                </template>
            </table>
        </div>

        <div x-data="{current: {}}" x-effect="
                if (Object.keys(current).length === 0 || current.id != selected){
                    current = documents[selected]
                } else {
                    update_document_inline(current);
                }
            " x-import="micro-doc">
                <ui-micro-doc hide-parent="true"></ui-micro-doc>
            </div>

    </div>
</template>
