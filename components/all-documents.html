<template x-component="all-documents">
    <div x-data="SearchEngine">

        <!-- controls  -->
        <div class="flex flex-wrap items-center gap-3 mb-5">
            <!-- Search bar -->
            <div class="relative flex-1 min-w-[200px]">
                <input
                        type="search"
                        x-model="search"
                        placeholder="Search..."
                        list="auto-suggest"
                        class="input input-primary input-sm w-full pr-10"
                />

                <datalist id="auto-suggest">
                    <template x-for="suggestion in suggestions">
                        <option :value="suggestion"></option>
                    </template>
                </datalist>

                <svg xmlns="http://www.w3.org/2000/svg"
                     class="w-4 h-4 absolute right-3 top-1/2 -translate-y-1/2 text-primary opacity-70" fill="none"
                     viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                          d="M21 21l-4.35-4.35M11 19a8 8 0 100-16 8 8 0 000 16z"/>
                </svg>
            </div>

            <!-- Selected tag counter -->
            <div
                    class="badge badge-primary badge-outline text-xs font-medium px-3 py-2"
                    x-show="selectedTags.length > 0"
                    x-transition
            >
                <span class="ml-1">filtered on</span>&nbsp;
                <span x-text="selectedTags.length"></span>&nbsp;
                <span class="ml-1"> tags</span>
            </div>

            <!-- Selected document counter -->
            <div
                    class="badge badge-primary badge-outline text-xs font-medium px-3 py-2"
                    x-show="results.length > 0"
                    x-transition
            >
                <span x-text="results.length"></span>&nbsp;
                <span class="ml-1"> documents</span>
            </div>

            <label class="label">
                <input type="checkbox" checked="checked" class="toggle toggle-sm" x-model="showDeleted"/>
                &nbsp;Search archive
            </label>

            <!-- Clear filters button -->
            <button
                    class="btn btn-error btn-outline btn-sm"
                    @click="clear_filters"
                    :disabled="selectedTags.length === 0 && !search"
            >
                Clear filters
            </button>
        </div>

        <!-- tags -->
        <div class="grid grid-cols-12 gap-3">
            <div class="col-span-8">
                <div x-data="{ expanded: false }" class="mt-2">
                    <div
                            class="relative transition-all duration-300 ease-in-out overflow-hidden"
                            :class="expanded ? 'max-h-[600px]' : 'max-h-[200px]'">
                        <!-- jouw tagsectie komt hier -->
                        <div x-effect="prepare(tags)" class="grid grid-cols-6 gap-x-6 text-sm leading-relaxed">
                            <template x-for="[letter, tags] of Object.entries(groupedTags)" :key="letter">
                                <div>
                                    <h3 class="font-semibold text-neutral-content underline underline-offset-2 mb-1"
                                        x-text="letter"></h3>
                                    <ul class="space-y-0.5">
                                        <template x-for="tag in tags" :key="tag">
                                            <li>
                                                <label class="cursor-pointer">
                                                    <input type="checkbox" x-model="selectedTags" :value="tag"
                                                           class="hidden"/>
                                                    <span
                                                            class="transition-colors border-b border-transparent hover:border-primary/60"
                                                            :class="selectedTags.includes(tag)
                            ? 'text-primary underline underline-offset-2'
                            : 'text-base-content/70 hover:text-primary'"
                                                            x-text="tag"
                                                    ></span>
                                                </label>
                                            </li>
                                        </template>
                                    </ul>
                                </div>
                            </template>
                        </div>

                        <!-- fade overlay -->
                        <div
                                class="absolute bottom-0 left-0 right-0 h-10 bg-gradient-to-t from-base-100 to-transparent pointer-events-none"
                                x-show="!expanded"
                        ></div>
                    </div>

                    <!-- toggle knop -->
                    <div class="flex justify-center mt-2">
                        <button
                                class="btn btn-xs btn-ghost text-primary"
                                @click="expanded = !expanded"
                                x-text="expanded ? 'Show less' : 'Show more'"
                        ></button>
                    </div>
                </div>
            </div>
            <div class="col-span-4" x-import="doc-components/node-diagram">
                <ui-large-node-diagram></ui-large-node-diagram>
            </div>
        </div>

        <!-- results -->
        <table class="table" x-effect="filter(index.documents,selectedTags,prefilter);$dispatch('reload')">
            <template x-for="doc in results" :key="doc.id">
                <tr>
                    <th x-text="doc.type"></th>
                    <td x-text="doc.status"></td>
                    <td x-text="doc.name"></td>
                    <td>
                        <a class="btn btn-ghost btn-sm" @click="open_doc(doc.id)">open</a>
                    </td>
                </tr>
            </template>
        </table>

    </div>
</template>
