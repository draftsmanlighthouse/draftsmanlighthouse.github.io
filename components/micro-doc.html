<template x-component="micro-doc">
    <template x-if="'sections' in current">
        <div class="m-5" x-import="docs/parent-link;
                                   docs/pitch-header;
                                   docs/scope-header;
                                   docs/design-decision-header;
                                   docs/principle-header;
                                   docs/persona-header">
            <template x-if="$prop('hide-parent') != 'true'">
                <ui-parent-link></ui-parent-link>
            </template>
            <ui-pitch-header></ui-pitch-header>
            <ui-scope-header></ui-scope-header>
            <ui-design-decision-header></ui-design-decision-header>
            <ui-principle-header></ui-principle-header>
            <ui-persona-header></ui-persona-header>

            <!-- content -->
            <div>
                <template x-for="section in current.sections" :key="section.id">
                    <div class="relative my-10 group">

                        <!-- Markdown -->
                        <template x-if="section.type == 'markdown'">
                            <div
                                    x-data="{content: ''}"
                                    x-init="content = section.body"
                                    x-effect="section.body = content"
                                    x-import="doc-sections/markdown">
                                <ui-markdown></ui-markdown>
                            </div>
                        </template>

                        <!-- Draw.io -->
                        <template x-if="section.type == 'drawio'">
                            <div
                                    x-data="{currentDiagram: '', selectedMode: 'minimal'}"
                                    x-init="currentDiagram = section.body"
                                    x-effect="section.body = currentDiagram"
                                    x-import="doc-sections/drawio">
                                <ui-drawio></ui-drawio>
                            </div>
                        </template>

                        <!-- Sketch -->
                        <template x-if="section.type == 'sketch'">
                            <div
                                    x-data="{currentDiagram: '', selectedMode: 'sketch'}"
                                    x-init="currentDiagram = section.body"
                                    x-effect="section.body = currentDiagram"
                                    x-import="doc-sections/drawio">
                                <ui-drawio></ui-drawio>
                            </div>
                        </template>

                        <!-- Mermaid -->
                        <template x-if="section.type == 'mermaid'">
                            <div
                                    x-data="{currentDiagram: ''}"
                                    x-init="currentDiagram = section.body"
                                    x-effect="section.body = currentDiagram"
                                    x-import="doc-sections/mermaid">
                                <ui-mermaid></ui-mermaid>
                            </div>
                        </template>

                        <!-- Chart -->
                        <template x-if="section.type == 'chart'">
                            <div
                                    x-data="{currentData: ''}"
                                    x-init="currentData = section.body"
                                    x-effect="section.body = currentData"
                                    x-import="doc-sections/charts">
                                <ui-charts></ui-charts>
                            </div>
                        </template>

                        <!-- embed -->
                        <template x-if="section.type == 'reference'">
                            <div x-import="doc-sections/embedded">
                                <ui-embedded></ui-embedded>
                            </div>
                        </template>

                        <!-- Floating delete icon -->
                        <button
                                @click="removeSection(section)"
                                class="absolute top-2 right-2 text-gray-400 hover:text-error transition">
                            <i class="fa-solid fa-trash"></i>
                        </button>
                    </div>
                </template>

                <ul x-data="{active: false}"
                    @mouseenter.debounce.300ms="active = true"
                    @mouseleave.debounce.300ms="active = false"
                    class="menu menu-horizontal menu-sm bg-base-200 rounded-box mt-5">
                    <li class="menu-disabled">
                        <a>
                            <i class="fa-solid fa-plus"></i>
                        </a>
                    </li>
                    <li x-show="active" x-cloak x-transition>
                        <a @click="add_markdown_section"
                           class="tooltip tooltip-bottom"
                           data-tip="Add Markdown section">
                            <i class="fa-brands fa-markdown"></i>
                        </a>
                    </li>
                    <li x-show="active" x-cloak x-transition>
                        <a @click="add_drawio_section"
                           class="tooltip tooltip-bottom"
                           data-tip="Add DrawIO section">
                            <i class="fa-solid fa-draw-polygon"></i>
                        </a>
                    </li>
                    <li x-show="active" x-cloak x-transition>
                        <a @click="add_sketch_section"
                           class="tooltip tooltip-bottom"
                           data-tip="Add sketch section">
                            <i class="fa-solid fa-pencil"></i>
                        </a>
                    </li>
                    <li x-show="active" x-cloak x-transition>
                        <a @click="add_mermaid_section"
                           class="tooltip tooltip-bottom"
                           data-tip="Add Mermaid section">
                            <i class="fa-solid fa-diagram-project"></i>
                        </a>
                    </li>
                    <li x-show="active" x-cloak x-transition>
                        <a @click="add_chart_section"
                           class="tooltip tooltip-bottom"
                           data-tip="Add data section">
                            <i class="fa-solid fa-chart-line"></i>
                        </a>
                    </li>
                    <li x-show="active" x-cloak x-transition>
                        <a @click="add_reference_section"
                           class="tooltip tooltip-bottom"
                           data-tip="Add embed section">
                            <i class="fa-solid fa-file-import"></i>
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </template>
</template>
