<template x-component="scope-header">
    <template x-if="'type' in current && current.type == 'scope'">
        <div>
            <input class="text-6xl" type="text" x-model="current.title" placeholder="Scope Title"/>


            <div x-data="{hill_data: [{ id: current.id, name: '', progress: current.attributes.progress },]}"
                 x-effect="current.attributes.progress = hill_data[0].progress">
                <div
                        x-data="hillChart(hill_data, { readonly: false })"
                ></div>
            </div>

            <hr class="mb-10">
        </div>
    </template>
</template>
