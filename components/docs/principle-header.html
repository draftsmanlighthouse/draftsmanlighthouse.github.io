<template x-component="principle-header">
    <template x-if="'type' in current && current.type == 'principle'">
        <div>
            <input class="text-5xl w-full" type="text" x-model="current.title" placeholder="Pitch Title"/>
            <table class="table">
                <tr>
                    <th>Status</th>
                    <td
                            x-data="{status: {'draft':'select-primary', 'review': 'select-warning', 'decided': 'select-success', 'rejected': 'select-error'}}">
                        <select x-model="current.status"
                                :class="status[current.status]"
                                class="select select-xs">
                            <option>init</option>
                            <option>draft</option>
                            <option>review</option>
                            <option>published</option>
                            <option>deleted</option>
                        </select>
                    </td>
                </tr>
                <tr x-show="!['published','deleted'].includes(current.status)" x-cloak x-transition>
                    <th>Prio</th>
                    <td x-init="current.prio = current.prio ? current.prio : 0"
                        x-data="{prio: {0: 'select-primary', 1: 'select-accent', 2: 'select-info', 3: 'select-ghost'}}">
                        <select x-model="current.prio"
                                :class="prio[current.prio]"
                                class="select select-xs">
                            <option value="0">Must have</option>
                            <option value="1">Should have</option>
                            <option value="2">Could have</option>
                            <option value="3">Won't have</option>
                        </select>
                    </td>
                </tr>
                <tr>
                    <th>Scope</th>
                    <td>
                        <select x-model="current.scope"
                                class="select select-xs">
                            <option value="enterprise">enterprise</option>
                            <template x-for="container in Object.keys(c4_data.components)">
                                <template x-if="container.split(':').length != 3">
                                    <option x-text="container" :value="component_index[container]"
                                                    :selected="component_index[container] == current.scope"></option>
                                </template>
                            </template>
                        </select>
                    </td>
                </tr>
                <tr>
                    <th>Summary</th>
                    <td>
                        <div
                                x-data="{content: ''}"
                                x-init="content = current.principle ? current.principle : PRINCIPLE"
                                x-effect="current.principle = content"
                                x-import="doc-sections/markdown">
                            <ui-markdown></ui-markdown>
                        </div>
                    </td>
                </tr>
            </table>
            <hr class="mb-10">
        </div>
    </template>
</template>
