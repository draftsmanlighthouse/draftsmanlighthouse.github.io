<template x-component="section">
    <div class="relative my-10 group">

        <!-- Markdown -->
        <template x-if="section.type == 'markdown'">
            <div
                    x-data="{content: ''}"
                    x-init="content = section.data"
                    x-effect="section.data = content;$dispatch('change')"
                    x-import="doc-sections/markdown">
                <ui-markdown></ui-markdown>
            </div>
        </template>

        <!-- Draw.io -->
        <template x-if="section.type == 'drawio'">
            <div
                    x-data="{currentDiagram: '', selectedMode: 'minimal'}"
                    x-init="currentDiagram = section.data"
                    x-effect="section.data = currentDiagram;$dispatch('change')"
                    x-import="doc-sections/drawio">
                <ui-drawio></ui-drawio>
            </div>
        </template>

        <!-- Sketch -->
        <template x-if="section.type == 'sketch'">
            <div
                    x-data="{currentDiagram: '', selectedMode: 'sketch'}"
                    x-init="currentDiagram = section.data"
                    x-effect="section.data = currentDiagram;$dispatch('change')"
                    x-import="doc-sections/drawio">
                <ui-drawio></ui-drawio>
            </div>
        </template>

        <!-- Mermaid -->
        <template x-if="section.type == 'mermaid'">
            <div
                    x-data="{currentDiagram: ''}"
                    x-init="currentDiagram = section.data"
                    x-effect="section.data = currentDiagram;$dispatch('change')"
                    x-import="doc-sections/mermaid">
                <ui-mermaid></ui-mermaid>
            </div>
        </template>

        <!-- Chart -->
        <template x-if="section.type == 'chart'">
            <div
                    x-data="{currentData: ''}"
                    x-init="currentData = section.data"
                    x-effect="section.data = currentData;$dispatch('change')"
                    x-import="doc-sections/charts">
                <ui-charts></ui-charts>
            </div>
        </template>

        <!-- Table -->
        <template x-if="section.type == 'table'">
            <div x-data="tableEditor">
                <hr class="mb-[30px]">
                <table class="table">
            <template x-for="row in [...Array(section.rows).keys()]" :key="row">
                <tr>
                    <template x-for="col in [...Array(section.cols).keys()]" :key="row + '-' + col">

                        <td
                            :style="{
                                backgroundColor: get_cell(row,col).bg ?? '',
                                color: get_cell(row,col).color ?? ''
                            }"

                            :class="[
                                'border border-base-200',
                                ((col === 0 && section.header?.row) || (row === 0 && section.header?.col))
                                    ? 'bg-base-200 font-semibold text-base-content/80 border-base-300 text-lg'
                                    : '',
                                get_cell(row,col).bold ? 'font-bold' : '',
                                get_cell(row,col).italic ? 'italic' : '',
                            ]"

                            :contenteditable="!readonly"
                            @contextmenu.prevent.stop="openCellMenu(row,col,$event)"
                            @focusout="if(!readonly){ updateCell(row,col,$el.innerText) }"
                            x-text="get_cell(row,col).value"
                        ></td>

                    </template>
                </tr>
            </template>
        </table>
                <div x-show="contextMenu.visible"
                     class="fixed z-50 bg-base-100 rounded shadow p-2 w-40"
                     :style="`top:${contextMenu.y}px;left:${contextMenu.x}px`">

                    <button class="btn btn-xs w-full"
                            @click="toggleBold()">Bold</button>

                    <button class="btn btn-xs w-full mt-1"
                            @click="toggleItalic()">Italic</button>

                    <div class="mt-2 text-sm opacity-70">Background</div>
                    <input type="color" class="w-full h-6 p-0"
                           @input="setBg($event.target.value)">

                    <div class="mt-2 text-sm opacity-70">Text</div>
                    <input type="color" class="w-full h-6 p-0"
                           @input="setColor($event.target.value)">

                    <button class="btn btn-xs w-full mt-2 btn-error"
                            @click="resetCell()">Reset</button>
                    <button class="btn btn-xs w-full mt-2 btn-neutral btn-outline"
                            @click="hideContextMenu()">Close</button>
                </div>
            </div>
        </template>

        <!-- image -->
        <template x-if="section.type == 'image'">
            <div>
                <template x-if="!$prop('deck')">
                    <img x-data="{expanded: microDoc.json.type == 'infodeck'}"
                         @click="expanded = !expanded"
                         :src="section.data"
                         :class="expanded ? 'h-auto' : 'h-[25vh]'"
                         class="max-w-full mx-auto rounded shadow cursor-pointer">
                </template>
                <template x-if="$prop('deck')">
                    <img
                            :src="section.data"
                            :class="$el.closest('.grid').classList[3]"
                            class="max-w-full mx-auto rounded shadow cursor-pointer">
                </template>
            </div>
        </template>

        <!-- embed -->
        <template x-if="section.type == 'reference'">
            <div x-import="doc-sections/embedded">
                <ui-embedded></ui-embedded>
            </div>
        </template>

        <!-- Floating delete icon -->
        <div x-show="$prop('deck')" class="absolute top-0 right-[-20px]">
            <button
                    @click="removeSection(section);$dispatch('removed');"
                    class="text-gray-400 hover:text-error transition">
                <i class="fa-solid fa-trash"></i>
            </button>
            <div x-effect="if($prop('deck') && 'type' in section && ['drawio','sketch','chart','mermaid'].includes(section.type)){
                        try{
                        $el.closest('.content-container').classList.remove('flex');}catch{}
                    }else{
                        try{$el.closest('.content-container').classList.add('flex');}catch{}
                    }"></div>
        </div>
        <div x-show="!$prop('deck')" class="absolute top-2 right-2">
            <template x-if="section.type == 'table'">
                <i class="mr-3 cursor-pointer fa-solid fa-gear text-gray-400 hover:text-info"
                   @click="table_settings.showModal()"></i>
            </template>
            <template x-if="section.type == 'reference' && section.document">

                <div class="badge badge-outline badge-info cursor-pointer mr-3 hover:text-warning transition"
                     x-text="index.documents[section.document].name"
                     @click="open_doc(section.document)"></div>

            </template>
            <template x-if="section.type == 'reference' && !section.document">

                <div class="badge badge-outline badge-error mr-3">reference not configured</div>

            </template>
            <template x-if="section.type == 'reference'">
                <i class="mr-3 cursor-pointer fa-regular fa-pen-to-square text-gray-400 hover:text-warning"
                   @click="$dispatch('edit-embed')"></i>
            </template>

            <button
                    @click="copyShortId(shortId(section.id), $event)"
                    class="text-gray-400 hover:text-info transition mr-3 relative"
            >
                <i class="fa-solid fa-fingerprint"></i>

                <!-- tooltip -->
                <span class="absolute -top-6 left-1/2 -translate-x-1/2
                                 bg-base-200 text-xs px-2 py-1 rounded shadow opacity-0
                                 transition pointer-events-none"
                      x-ref="tooltip">
                        copied!
                    </span>
            </button>

            <button
                    @click="removeSection(section)"
                    class="text-gray-400 hover:text-error transition">
                <i class="fa-solid fa-trash"></i>
            </button>
        </div>

        <dialog id="table_settings" class="modal">
            <div class="modal-box">
                <h3 class="text-lg font-bold">Configure table</h3>
                <p class="py-4">
                <table class="table table-sm">
                    <tr>
                        <th>Column header</th>
                        <td>
                            <input type="checkbox" x-model="section.header.col" class="toggle toggle-info"/>
                        </td>
                    </tr>
                    <tr>
                        <th>Row header</th>
                        <td>
                            <input type="checkbox" x-model="section.header.row" class="toggle toggle-info"/>
                        </td>
                    </tr>
                    <tr>
                        <th># columns</th>
                        <td>
                            <input type="number" x-model.number="section.cols" class="input" min="1"/>
                        </td>
                    </tr>
                    <tr>
                        <th># rows</th>
                        <td>
                            <input type="number" x-model.number="section.rows" class="input" min="1"/>
                        </td>
                    </tr>
                </table>
                </p>
            </div>
            <form method="dialog" class="modal-backdrop">
                <button>close</button>
            </form>
        </dialog>

    </div>
</template>
<template x-component="main">
    <div x-data="SectionHelper">
        <template x-for="section in microDoc.json.sections" :key="section.id">
            <ui-section></ui-section>
        </template>
        <ul x-data="{active: false}"
            @mouseenter.debounce.300ms="active = true"
            @mouseleave.debounce.300ms="active = false"
            class="menu menu-horizontal menu-sm bg-base-200 rounded-box mt-5">
            <li class="menu-disabled">
                <a>
                    <i class="fa-solid fa-plus"></i>
                </a>
            </li>
            <li x-show="active" x-cloak x-transition>
                <a @click="add_markdown_section"
                   class="tooltip tooltip-bottom"
                   data-tip="Add Markdown section">
                    <i class="fa-brands fa-markdown"></i>
                </a>
            </li>
            <li x-show="active" x-cloak x-transition>
                <a @click="add_drawio_section"
                   class="tooltip tooltip-bottom"
                   data-tip="Add DrawIO section">
                    <i class="fa-solid fa-draw-polygon"></i>
                </a>
            </li>
            <li x-show="active" x-cloak x-transition>
                <a @click="add_sketch_section"
                   class="tooltip tooltip-bottom"
                   data-tip="Add sketch section">
                    <i class="fa-solid fa-pencil"></i>
                </a>
            </li>
            <li x-show="active" x-cloak x-transition>
                <a @click="add_mermaid_section"
                   class="tooltip tooltip-bottom"
                   data-tip="Add Mermaid section">
                    <i class="fa-solid fa-diagram-project"></i>
                </a>
            </li>
            <li x-show="active" x-cloak x-transition>
                <a @click="add_chart_section"
                   class="tooltip tooltip-bottom"
                   data-tip="Add data section">
                    <i class="fa-solid fa-chart-line"></i>
                </a>
            </li>
            <li x-show="active" x-cloak x-transition>
                <a @click="add_table_section"
                   class="tooltip tooltip-bottom"
                   data-tip="Add table section">
                    <i class="fa-solid fa-table-cells-large"></i>
                </a>
            </li>
            <li x-show="active" x-cloak x-transition>
                <a @click="image_modal.showModal()"
                   class="tooltip tooltip-bottom"
                   data-tip="Add image section">
                    <i class="fa-regular fa-image"></i>
                </a>
            </li>
            <li x-show="active" x-cloak x-transition>
                <a @click="add_reference_section"
                   class="tooltip tooltip-bottom"
                   data-tip="Add embed section">
                    <i class="fa-solid fa-file-import"></i>
                </a>
            </li>
        </ul>

        <!-- Open the modal using ID.showModal() method -->
        <dialog id="image_modal" class="modal">
            <div class="modal-box">
                <h3 class="text-lg font-bold">Select image</h3>
                <p class="py-4">
                    <input type="file"
                           class="file-input"
                           accept="image/png,image/jpeg,image/webp,image/gif,image/avif"
                           @change="addImage($event); $el.value = null; image_modal.close()">
                </p>
            </div>
            <form method="dialog" class="modal-backdrop">
                <button>close</button>
            </form>
        </dialog>
    </div>
</template>
