<template x-component="section-selector">
    <dialog id="section_selector" class="modal" x-data="{archive: [],view_archive:false}"
            x-effect="archive = microDoc.json.archive.filter(x => x.type != 'slide')">
        <div class="modal-box max-w-[80vw] w-[80vw]"
             x-data="{search: $persist('').as('slideSection'), items: [], suggestions: [],selected_section: {}}">
            <h3 class="text-lg font-bold">Configure section</h3>
            <p class="py-4"
               x-effect="suggestions = sectionIndex.autoSuggest(search);items = sectionIndex.search(search);">

            <ul class="menu menu-horizontal bg-base-200 rounded-box my-5">
                <li class="menu-disabled p-2">
                    Add inline section:
                </li>
                <li>
                    <a @click="let id = add_markdown_section();selected.sections[section] = {parent: microDoc.id ,id};section_selector.close();selected_section = {};"
                       class="tooltip tooltip-bottom"
                       data-tip="Add Markdown section">
                        <i class="fa-brands fa-markdown"></i>
                    </a>
                </li>
                <li>
                    <a @click="let id = add_drawio_section();selected.sections[section] = {parent: microDoc.id ,id};section_selector.close();selected_section = {};"
                       class="tooltip tooltip-bottom"
                       data-tip="Add DrawIO section">
                        <i class="fa-solid fa-draw-polygon"></i>
                    </a>
                </li>

                <li>
                    <a @click="let id = add_sketch_section();selected.sections[section] = {parent: microDoc.id ,id};section_selector.close();selected_section = {};"
                       class="tooltip tooltip-bottom"
                       data-tip="Add sketch section">
                        <i class="fa-solid fa-pencil"></i>
                    </a>
                </li>
                <li>
                    <a @click="let id = add_mermaid_section();selected.sections[section] = {parent: microDoc.id ,id};section_selector.close();selected_section = {};"
                       class="tooltip tooltip-bottom"
                       data-tip="Add Mermaid section">
                        <i class="fa-solid fa-diagram-project"></i>
                    </a>
                </li>
                <li>
                    <a @click="let id = add_chart_section();selected.sections[section] = {parent: microDoc.id ,id};section_selector.close();selected_section = {};"
                       class="tooltip tooltip-bottom"
                       data-tip="Add data section">
                        <i class="fa-solid fa-chart-line"></i>
                    </a>
                </li>
                <li>
                    <a @click="let id = add_table_section();selected.sections[section] = {parent: microDoc.id ,id};section_selector.close();selected_section = {};"
                       class="tooltip tooltip-bottom"
                       data-tip="Add table section">
                        <i class="fa-solid fa-table-cells-large"></i>
                    </a>
                </li>
                <li>
                    <a @click="image_modal.showModal()"
                       class="tooltip tooltip-bottom"
                       data-tip="Add image section">
                        <i class="fa-regular fa-image"></i>
                    </a>
                </li>
                <li>
                    <a @click="let id = add_html_section();selected.sections[section] = {parent: microDoc.id ,id};section_selector.close();selected_section = {};"
                       class="tooltip tooltip-bottom"
                       data-tip="Add html section">
                        <i class="fa-solid fa-code"></i>
                    </a>
                </li>
                <li x-show="archive.length != 0" x-cloak x-transition>
                    <a @click="view_archive = !view_archive"
                       x-effect="if(archive.length == 0){view_archive = false}"
                       class="tooltip tooltip-bottom text-info"
                       data-tip="View inline archive">
                        <i class="fa-solid fa-box-archive"></i>
                    </a>
                </li>
                <li x-show="view_archive && Object.keys(selected_section).length != 0">
                    <button @click="
                                    microDoc.json.sections.push(selected_section);microDoc.json.archive = microDoc.json.archive.filter(x => x.id != selected_section.id);
                                    if(!(section in selected.sections))
                                        {selected.sections[section] = {}};
                                    selected.sections[section] = {parent: microDoc.id,id: selected_section.id};
                                    $dispatch('change');
                                    section_selector.close();selected_section = {};"
                                class="btn btn-success btn-outline btn-sm">
                            <i class="fa-regular fa-circle-check"></i> unarchive
                        </button>
                </li>
            </ul>

            <dialog id="image_modal" class="modal">
                <div class="modal-box">
                    <h3 class="text-lg font-bold">Select image</h3>
                    <p class="py-4">
                        <input type="file"
                               class="file-input"
                               accept="image/png,image/jpeg,image/webp,image/gif,image/avif"
                               @change="let id = await addImage($event);selected.sections[section] = {parent: microDoc.id ,id};$el.value = null; image_modal.close();section_selector.close();selected_section = {};">
                    </p>
                </div>
                <form method="dialog" class="modal-backdrop">
                    <button>close</button>
                </form>
            </dialog>

            <table class="table table-sm mb-5" x-show="!view_archive" x-cloak x-transition>
                <tr>
                    <td>
                        <input
                                type="search"
                                x-model="search"
                                list="auto-suggest"
                                placeholder="Search for section knowledge base..."
                                class="input input-primary input-sm w-full pr-10"/>
                        <datalist id="auto-suggest">
                            <template x-for="suggestion in suggestions.map(x => x.suggestion)">
                                <option :value="suggestion"></option>
                            </template>
                        </datalist>
                    </td>
                    <td x-show="Object.keys(selected_section).length != 0 && (!images || selected_section.type == 'image')"
                        x-cloak x-transition>
                        <button @click="
                                    if(!(section in selected.sections))
                                        {selected.sections[section] = {}};
                                    selected.sections[section] = {parent: selected_section.parent_id,id: selected_section.section_id};
                                    $dispatch('change');
                                    section_selector.close();selected_section = {};"
                                class="btn btn-success btn-outline btn-sm">
                            <i class="fa-regular fa-circle-check"></i> select
                        </button>
                    </td>
                </tr>
                <tr x-show="section in selected.sections" x-cloak x-transition>
                    <td>
                        Selected: <span x-text="index.documents[selected.sections[section].parent].name"></span>&nbsp;
                        <span x-text="index.documents[selected.sections[section].parent].sections.find(s => s.id == selected.sections[section].id).type"></span>&nbsp;
                        <span class="text-gray-400" x-text="shortId(selected.sections[section].id)"></span>
                    </td>
                    <td>
                        <button @click="delete selected.sections[section];
                                    $dispatch('change');
                                    section_selector.close();"
                                class="btn btn-error btn-outline btn-sm">
                            <i class="fa-solid fa-xmark"></i> remove
                        </button>
                    </td>
                </tr>
            </table>

            <div class="grid grid-cols-12 gap-3">
                <div class="col-span-4">
                    <ul class="menu">
                        <template x-for="item in !view_archive ? items : archive" :key="item.id">
                            <template x-if="!images || item.type == 'image'">
                                <li x-init="if(view_archive){
                                        item.parent_name = microDoc.json.name;
                                    }">
                                    <a @click="selected_section = item">
                                        <span x-text="item.parent_name"></span>&nbsp;
                                        <span x-text="item.type"></span>&nbsp;
                                        <span class="text-gray-400" x-text="item.short_id"></span>
                                    </a>
                                </li>
                            </template>
                        </template>
                    </ul>
                </div>
                <template x-if="!view_archive">
                    <div class="col-span-8"
                         x-effect="visible=false;doc_section = await fetch_section(selected_section.parent_id,selected_section.section_id);visible=true;"
                         x-import="doc-sections/read-only"
                         x-data="{doc_section: '',visible: false}">
                        <template x-if="visible">
                            <ui-read-only></ui-read-only>
                        </template>
                    </div>
                </template>
                <template x-if="view_archive">
                    <div class="col-span-8"
                         x-effect="visible=false;doc_section = selected_section;visible=true;"
                         x-import="doc-sections/read-only"
                         x-data="{doc_section: '',visible: false}">
                        <template x-if="visible">
                            <ui-read-only></ui-read-only>
                        </template>
                    </div>
                </template>
            </div>
            </p>
        </div>
        <form method="dialog" class="modal-backdrop">
            <button>close</button>
        </form>
    </dialog>
</template>
