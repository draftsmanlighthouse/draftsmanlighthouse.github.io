<template x-component="org-selector">
    <div>
        <i class="fa-solid fa-building text-xl ml-5 text-white"></i>
        <select @change="open_organisation($el.value)"
                class="select select-ghost text-white text-xl m-5 w-auto">
            <option disabled selected>Select organisation</option>
            <template x-for="org in organisations" :key="org">
                <option :value="org" :selected="org == organisation.name" x-text="org"></option>
            </template>
            <option>new</option>
        </select>
    </div>
</template>
